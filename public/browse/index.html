<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Search Engine</title>
  <meta name="author" content="VoltacceptYT">
  <meta name="keywords" content="Search, Web Search, DuckDuckGo, Search Engine">
  <meta name="description" content="A simple web search engine powered by DuckDuckGo API.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/icon.png">
</head>
<body>
  <!-- Navigation Header -->
  <div id="nav-header">
    <div class="nav-content">
      <div class="logo-container">
        <img src="assets/icon.png" alt="Search Engine Logo" class="nav-logo">
        <h3>Search Engine</h3>
      </div>
      <div class="nav-links">
        <a href="/" class="nav-link" title="HoradrimAI Chat">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
            <path d="M8 0C3.6 0 0 3.6 0 8s3.6 8 8 8 8-3.6 8-8-3.6-8-8-8zm0 14c-3.3 0-6-2.7-6-6s2.7-6 6-6 6 2.7 6 6-2.7 6-6 6z"/>
            <path d="M11.5 5.5l-5 3 5 3z"/>
          </svg>
          Chat AI
        </a>
      </div>
    </div>
  </div>

  <!-- Main Search Container -->
  <div id="search-container">
    <div class="search-header">
      <h1>Search the Web</h1>
      <p class="search-subtitle">Powered by DuckDuckGo API</p>
    </div>
    
    <!-- Search Form -->
    <div class="search-form-container">
      <form id="searchForm">
        <div class="search-input-wrapper">
          <div class="search-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
              <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
            </svg>
          </div>
          <input 
            type="text" 
            id="searchInput"
            placeholder="Enter your search query..."
            autocomplete="off"
          >
          <button type="button" id="clearSearch" class="clear-btn" title="Clear search">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
              <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
            </svg>
          </button>
          <button type="submit" id="searchButton" class="search-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
              <path d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.002.002.26.41a.5.5 0 0 0 .886-.083l6-15z"/>
            </svg>
            Search
          </button>
        </div>
        
        <div class="quick-search-buttons">
          <button type="button" class="quick-search" data-query="weather forecast">Weather</button>
          <button type="button" class="quick-search" data-query="latest news">News</button>
          <button type="button" class="quick-search" data-query="sports scores">Sports</button>
          <button type="button" class="quick-search" data-query="movie reviews">Movies</button>
        </div>
      </form>
    </div>
    
    <!-- Results Container -->
    <div id="resultsContainer">
      <div class="initial-state">
        <div class="initial-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
          </svg>
        </div>
        <h3>Ready to Search</h3>
        <p>Enter a query above to search the web</p>
        <p class="search-tips">
          <strong>Tips:</strong> Try specific searches for better results
        </p>
      </div>
    </div>
    
    <!-- Loading Indicator -->
    <div id="loadingIndicator" class="loading-indicator">
      <div class="typing-indicator">
        <span>.</span><span>.</span><span>.</span>
      </div>
      <p>Searching...</p>
    </div>
    
    <!-- Error Display -->
    <div id="errorDisplay" class="error-container"></div>
  </div>

  <script>
    // Check if we're in an iframe
    const isInIframe = window.self !== window.top;
    
    // DOM Elements
    const searchForm = document.getElementById('searchForm');
    const searchInput = document.getElementById('searchInput');
    const searchButton = document.getElementById('searchButton');
    const clearSearch = document.getElementById('clearSearch');
    const resultsContainer = document.getElementById('resultsContainer');
    const loadingIndicator = document.getElementById('loadingIndicator');
    const errorDisplay = document.getElementById('errorDisplay');
    const quickSearchButtons = document.querySelectorAll('.quick-search');
    
    // State
    let currentSearch = '';
    let isLoading = false;
    
    // Initialize
    function init() {
      bindEvents();
      checkURLForQuery();
      
      // Only auto-focus if not in iframe
      if (!isInIframe) {
        setTimeout(() => {
          searchInput.focus();
        }, 100);
      }
    }
    
    function bindEvents() {
      // Form submission
      searchForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        await performSearch(searchInput.value.trim());
      });
      
      // Search button click
      searchButton.addEventListener('click', async (e) => {
        e.preventDefault();
        await performSearch(searchInput.value.trim());
      });
      
      // Clear search button
      clearSearch.addEventListener('click', () => {
        searchInput.value = '';
        clearSearch.style.display = 'none';
        if (!isInIframe) searchInput.focus();
      });
      
      // Search input events
      searchInput.addEventListener('input', function() {
        clearSearch.style.display = this.value ? 'flex' : 'none';
      });
      
      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          if (searchInput.value.trim()) {
            searchForm.dispatchEvent(new Event('submit'));
          }
        }
      });
      
      // Quick search buttons
      quickSearchButtons.forEach(button => {
        button.addEventListener('click', () => {
          const query = button.getAttribute('data-query');
          searchInput.value = query;
          performSearch(query);
        });
      });
      
      // Keyboard shortcuts (only if not in iframe)
      if (!isInIframe) {
        document.addEventListener('keydown', (e) => {
          // Focus search on Ctrl+K or Cmd+K
          if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            searchInput.focus();
          }
          
          // Clear search on Escape
          if (e.key === 'Escape' && document.activeElement === searchInput) {
            searchInput.value = '';
            clearSearch.style.display = 'none';
          }
        });
      }
    }
    
    function checkURLForQuery() {
      const urlParams = new URLSearchParams(window.location.search);
      const queryParam = urlParams.get('q');
      if (queryParam) {
        searchInput.value = queryParam;
        performSearch(queryParam);
      }
    }
    
    async function performSearch(query) {
      if (!query || isLoading) return;
      
      currentSearch = query;
      isLoading = true;
      
      // Update URL
      updateURL(query);
      
      // Show loading, hide results and error
      loadingIndicator.style.display = 'flex';
      resultsContainer.style.display = 'none';
      errorDisplay.style.display = 'none';
      errorDisplay.innerHTML = '';
      
      try {
        const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        
        // Handle response
        if (!response.ok) {
          // Try to get error message
          let errorMessage = `HTTP Error ${response.status}`;
          try {
            const errorData = await response.json();
            errorMessage = errorData.message || errorData.error || errorMessage;
          } catch (e) {
            // If not JSON, try text
            try {
              errorMessage = await response.text();
            } catch (e2) {
              // Keep original error message
            }
          }
          throw new Error(errorMessage);
        }
        
        const data = await response.json();
        displayResults(data);
        
      } catch (error) {
        console.error('Search error:', error);
        displayError(error.message || 'Search failed. Please try again.');
      } finally {
        isLoading = false;
        loadingIndicator.style.display = 'none';
      }
    }
    
    function displayResults(data) {
      resultsContainer.innerHTML = '';
      resultsContainer.style.display = 'block';
      
      // Results header
      const resultsHeader = document.createElement('div');
      resultsHeader.className = 'results-header';
      const resultCount = (data.results?.length || 0) + (data.relatedTopics?.length || 0);
      resultsHeader.innerHTML = `
        <p class="results-count">About ${resultCount} results for "${currentSearch}"</p>
      `;
      resultsContainer.appendChild(resultsHeader);
      
      // Knowledge panel (abstract)
      if (data.abstract?.text) {
        const knowledgePanel = document.createElement('div');
        knowledgePanel.className = 'knowledge-panel';
        knowledgePanel.innerHTML = `
          <div class="knowledge-header">
            <h3>${data.abstract.heading || 'Summary'}</h3>
            ${data.image ? `<img src="${data.image}" alt="${data.abstract.heading || 'Image'}" class="knowledge-image" onerror="this.style.display='none'">` : ''}
          </div>
          <div class="knowledge-content">
            <p>${data.abstract.text}</p>
            ${data.abstract.source ? `<p class="knowledge-source">Source: ${data.abstract.source}</p>` : ''}
            ${data.abstract.url ? `<a href="${data.abstract.url}" target="_blank" class="knowledge-link">Read more</a>` : ''}
          </div>
        `;
        resultsContainer.appendChild(knowledgePanel);
      }
      
      // Search results
      if (data.results && data.results.length > 0) {
        const resultsList = document.createElement('div');
        resultsList.className = 'results-list';
        
        data.results.forEach((result, index) => {
          const resultItem = document.createElement('div');
          resultItem.className = 'result-item';
          
          let domain = '';
          try {
            domain = new URL(result.url).hostname.replace('www.', '');
          } catch {
            domain = result.url;
          }
          
          resultItem.innerHTML = `
            <div class="result-url">
              <span>${domain}</span>
            </div>
            <h4 class="result-title">
              <a href="${result.url}" target="_blank" rel="noopener noreferrer">${result.title || 'Untitled'}</a>
            </h4>
            <p class="result-description">${result.description || 'No description available.'}</p>
          `;
          
          resultsList.appendChild(resultItem);
        });
        
        resultsContainer.appendChild(resultsList);
      }
      
      // Related topics
      if (data.relatedTopics && data.relatedTopics.length > 0) {
        const relatedContainer = document.createElement('div');
        relatedContainer.className = 'related-topics';
        relatedContainer.innerHTML = '<h4>Related Searches</h4>';
        
        const relatedList = document.createElement('div');
        relatedList.className = 'related-list';
        
        data.relatedTopics.slice(0, 6).forEach(topic => {
          const relatedItem = document.createElement('button');
          relatedItem.className = 'related-item';
          relatedItem.textContent = topic.title;
          relatedItem.setAttribute('data-query', topic.title);
          
          relatedItem.addEventListener('click', () => {
            searchInput.value = topic.title;
            performSearch(topic.title);
          });
          
          relatedList.appendChild(relatedItem);
        });
        
        relatedContainer.appendChild(relatedList);
        resultsContainer.appendChild(relatedContainer);
      }
      
      // If no results
      if (!data.abstract?.text && (!data.results || data.results.length === 0) && (!data.relatedTopics || data.relatedTopics.length === 0)) {
        const noResults = document.createElement('div');
        noResults.className = 'no-results';
        noResults.innerHTML = `
          <div class="no-results-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
              <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
            </svg>
          </div>
          <h3>No results found</h3>
          <p>Try different keywords or check your spelling</p>
          <button onclick="window.open('https://duckduckgo.com/?q=${encodeURIComponent(currentSearch)}', '_blank')" class="external-search-btn">
            Search on DuckDuckGo
          </button>
        `;
        resultsContainer.appendChild(noResults);
      }
    }
    
    function displayError(errorMessage) {
      errorDisplay.style.display = 'block';
      errorDisplay.innerHTML = `
        <div class="error-content">
          <div class="error-icon">⚠️</div>
          <h4>Search Error</h4>
          <p>${errorMessage}</p>
          <button onclick="window.open('https://duckduckgo.com/?q=${encodeURIComponent(currentSearch)}', '_blank')" class="external-search-btn">
            Try DuckDuckGo directly
          </button>
        </div>
      `;
    }
    
    function updateURL(query) {
      const url = new URL(window.location);
      url.searchParams.set('q', query);
      window.history.pushState({}, '', url);
    }
    
    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', init);
  </script>
  
  <style>
