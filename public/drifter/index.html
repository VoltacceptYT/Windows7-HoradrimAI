<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Drifter AI</title>
  <meta name="author" content="Voltaccept">
  <meta name="keywords" content="Drifter AI, Voltaccept, AI Assistant, Chatbot, AI">
  <meta name="description" content="Drifter AI - Created by Voltaccept. Your intelligent AI assistant.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://assets.voltaccept.com/img/ai/icon.png">
  <script src="https://cdn.jsdelivr.net/npm/marked@16.0.0/lib/marked.umd.min.js"></script>
</head>

<body>
  <!-- Sidebar for Chat History -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h3>Chat History</h3>
      <button id="new-chat-btn" class="sidebar-btn" title="New Chat">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
          <path
            d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z" />
        </svg>
      </button>
    </div>
    <div id="chat-sessions">
      <!-- Chat sessions will be dynamically added here -->
    </div>
  </div>

  <!-- Main Chat Container -->
  <div id="chat-container">
    <div id="chat-box">
      <div id="messages"></div>
    </div>
    <form id="chat-form">
      <textarea type="text" id="user-input" placeholder="Type your message here..." required=""
        style="white-space: pre-wrap;"></textarea>
      <button type="submit" id="send-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
          <path
            d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.002.002.26.41a.5.5 0 0 0 .886-.083zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215 7.494-7.494 1.178-.471z">
          </path>
        </svg>
      </button>
      <button type="button" id="clear-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
          <path
            d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5M8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5m3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0">
          </path>
        </svg>
      </button>
    </form>
  </div>

  <!-- Confirmation Modal -->
  <div id="confirmClearModal" class="confirm-modal">
    <div class="confirm-modal-content">
      <p>Are you sure you want to clear the chat history?</p>
      <div class="modal-buttons">
        <button id="confirmClearYes">Yes</button>
        <button id="confirmClearNo">No</button>
      </div>
    </div>
  </div>

  <!-- Delete Session Confirmation Modal -->
  <div id="confirmDeleteModal" class="confirm-modal">
    <div class="confirm-modal-content">
      <p>Are you sure you want to delete this chat?</p>
      <div class="modal-buttons">
        <button id="confirmDeleteYes">Yes</button>
        <button id="confirmDeleteNo">No</button>
      </div>
    </div>
  </div>

  <!-- Rename Session Modal -->
  <div id="renameModal" class="confirm-modal">
    <div class="confirm-modal-content">
      <p>Enter new chat name:</p>
      <input type="text" id="renameInput" placeholder="Chat name..." maxlength="50">
      <div class="modal-buttons">
        <button id="renameConfirm">Save</button>
        <button id="renameCancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- New Chat Modal -->
  <div id="newChatModal" class="confirm-modal">
    <div class="confirm-modal-content">
      <p>Start a new chat?</p>
      <p class="modal-subtitle">Current conversation will be saved automatically.</p>
      <div class="modal-buttons">
        <button id="newChatConfirm">New Chat</button>
        <button id="newChatCancel">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // Performance Mode Detection
    let lowMemoryMode = false;
    if (navigator.deviceMemory && navigator.deviceMemory <= 4) {
      lowMemoryMode = true;
      document.body.classList.add('low-memory');
    }

    // Chat history management with multiple sessions
    const MAX_SESSIONS = 20;
    const MAX_HISTORY = lowMemoryMode ? 25 : 50;

    // Get or initialize sessions from localStorage
    let chatSessions = JSON.parse(localStorage.getItem('chatSessions')) || [];
    let currentSessionId = localStorage.getItem('currentSessionId') || null;
    let pendingSession = null; // For new chat button

    // Initialize if no sessions exist
    if (chatSessions.length === 0) {
      createNewSession(true); // Create initial session immediately
    } else if (!currentSessionId) {
      currentSessionId = chatSessions[0].id;
      localStorage.setItem('currentSessionId', currentSessionId);
    }

    function getCurrentSession() {
      return chatSessions.find(session => session.id === currentSessionId);
    }

    function createNewSession(immediate = false) {
      const sessionId = 'session-' + Date.now();
      const newSession = {
        id: sessionId,
        name: `Chat ${chatSessions.length + 1}`,
        timestamp: Date.now(),
        messages: [],
        lastMessage: 'No messages yet'
      };

      if (immediate) {
        chatSessions.unshift(newSession);
        currentSessionId = sessionId;

        if (chatSessions.length > MAX_SESSIONS) {
          chatSessions = chatSessions.slice(0, MAX_SESSIONS);
        }

        localStorage.setItem('chatSessions', JSON.stringify(chatSessions));
        localStorage.setItem('currentSessionId', currentSessionId);

        renderChatHistory();
        renderChatSessions();
        return newSession;
      } else {
        // Store as pending session (will be created when first message is sent)
        pendingSession = newSession;
        return null;
      }
    }

    function activatePendingSession() {
      if (pendingSession) {
        // Check if pending session already exists (to avoid duplicates)
        const existingSession = chatSessions.find(s => s.id === pendingSession.id);
        if (!existingSession) {
          chatSessions.unshift(pendingSession);
          currentSessionId = pendingSession.id;

          if (chatSessions.length > MAX_SESSIONS) {
            chatSessions = chatSessions.slice(0, MAX_SESSIONS);
          }

          localStorage.setItem('chatSessions', JSON.stringify(chatSessions));
          localStorage.setItem('currentSessionId', currentSessionId);

          renderChatSessions();
        }
        pendingSession = null;
      }
    }

    function deleteSession(sessionId) {
      const sessionToDelete = chatSessions.find(session => session.id === sessionId);
      if (!sessionToDelete) return;

      chatSessions = chatSessions.filter(session => session.id !== sessionId);
      localStorage.setItem('chatSessions', JSON.stringify(chatSessions));

      // If we deleted the current session, switch to the first one
      if (sessionId === currentSessionId) {
        if (chatSessions.length > 0) {
          currentSessionId = chatSessions[0].id;
          localStorage.setItem('currentSessionId', currentSessionId);
          renderChatHistory();
        } else {
          createNewSession(true);
        }
      }

      renderChatSessions();
    }

    function switchSession(sessionId) {
      currentSessionId = sessionId;
      localStorage.setItem('currentSessionId', sessionId);
      renderChatHistory();
      renderChatSessions();
    }

    function updateSessionName(sessionId, newName) {
      const session = chatSessions.find(s => s.id === sessionId);
      if (session) {
        session.name = newName.trim() || session.name;
        localStorage.setItem('chatSessions', JSON.stringify(chatSessions));
        renderChatSessions();
      }
    }

    function generateSessionNameFromMessage(message) {
      // Generate a meaningful session name from the first message
      const words = message.split(' ').slice(0, 8);

      // Check for key topics
      const commonTopics = {
        'how': 'How to',
        'what': 'What is',
        'why': 'Why does',
        'explain': 'Explanation:',
        'help': 'Help with',
        'difference': 'Comparing',
        'best': 'Best',
        'compare': 'Comparison'
      };

      let topicPrefix = '';
      const firstWord = words[0]?.toLowerCase();
      if (commonTopics[firstWord]) {
        topicPrefix = commonTopics[firstWord] + ' ';
      }

      return topicPrefix + words.slice(0, 4).join(' ') + (message.split(' ').length > 4 ? '...' : '');
    }

    function renderChatSessions() {
      const sessionsContainer = document.getElementById('chat-sessions');
      sessionsContainer.innerHTML = '';

      if (chatSessions.length === 0) {
        sessionsContainer.innerHTML = '<div class="no-sessions">No chats yet</div>';
        return;
      }

      chatSessions.forEach(session => {
        const sessionElement = document.createElement('div');
        sessionElement.className = 'chat-session';
        if (session.id === currentSessionId) {
          sessionElement.classList.add('active');
        }

        const sessionName = session.name || `Chat`;
        const lastMessage = session.messages.length > 0
          ? (session.lastMessage || session.messages[session.messages.length - 1].text.substring(0, 30) + '...')
          : 'No messages yet';

        const date = new Date(session.timestamp);
        const timeString = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const dateString = date.toLocaleDateString([], { month: 'short', day: 'numeric' });

        sessionElement.innerHTML = `
          <div class="session-content" data-session-id="${session.id}">
            <div class="session-name">${sessionName}</div>
            <div class="session-preview">${lastMessage}</div>
            <div class="session-time">${dateString} ${timeString}</div>
          </div>
          <button class="session-delete-btn" data-session-id="${session.id}" title="Delete chat">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
              <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
              <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4L4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
            </svg>
          </button>
        `;

        sessionsContainer.appendChild(sessionElement);

        // Add click event to switch session
        sessionElement.querySelector('.session-content').addEventListener('click', (e) => {
          e.stopPropagation();
          switchSession(session.id);
        });

        // Add delete button event
        sessionElement.querySelector('.session-delete-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          showDeleteConfirm(session.id);
        });

        // Double click to rename
        sessionElement.querySelector('.session-name').addEventListener('dblclick', (e) => {
          e.stopPropagation();
          showRenameModal(session.id, session.name);
        });
      });
    }

    function getOperatorProfilePicture() {
      return localStorage.getItem('profilePicture') || 'https://assets.voltaccept.com/img/ai/user-profile.png';
    }

    function checkLoginStatus() {
      const displayName = localStorage.getItem('displayName');
      if (displayName) {
        const googleOnloadElement = document.getElementById('g_id_onload');
        if (googleOnloadElement) {
          googleOnloadElement.remove();
        }
      }
    }
    document.addEventListener('DOMContentLoaded', checkLoginStatus);

    // Load chat history for current session
    function renderChatHistory() {
      const messages = document.getElementById('messages');
      messages.innerHTML = '';

      const currentSession = getCurrentSession();
      if (!currentSession) return;

      let startIdx = Math.max(0, currentSession.messages.length - MAX_HISTORY);
      currentSession.messages.slice(startIdx).forEach((message) => {
        addMessageToUI(message.text, message.role);
      });
      messages.scrollTop = messages.scrollHeight;
    }

    document.getElementById("chat-form").addEventListener("submit", function (event) {
      event.preventDefault();
      const userInput = document.getElementById("user-input").value;
      if (!userInput.trim()) return;

      // Activate pending session if exists (from New Chat button)
      if (pendingSession) {
        activatePendingSession();
      }

      addMessageToUI(userInput, "user");
      saveMessageToSession(userInput, "user");
      fetchGroqResponse(userInput);
      document.getElementById("user-input").value = "";
    });

    document.getElementById("user-input").addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        if (event.shiftKey) {
          const cursorPosition = this.selectionStart;
          const value = this.value;
          this.value = value.slice(0, cursorPosition) + "\n" + value.slice(cursorPosition);
          this.selectionEnd = cursorPosition + 1;
          event.preventDefault();
        } else {
          event.preventDefault();
          if (this.value.trim()) {
            document.getElementById("chat-form").dispatchEvent(new Event("submit"));
          }
        }
      }
    });

    function addMessageToUI(message, sender) {
      const messages = document.getElementById("messages");
      const profile = document.createElement('div');
      profile.classList.add('profile', `${sender}-profile`);
      const messageElement = document.createElement("div");
      messageElement.classList.add("message", `${sender}-message`);

      if (sender === "assistant") {
        const formattedMessage = marked.parse(message);
        messageElement.innerHTML = formattedMessage;
      } else {
        const userText = message.replace(/\n/g, '<br>');
        messageElement.innerHTML = marked.parse(userText);
      }

      if (sender === "user") {
        profile.innerHTML = `<img src="${getOperatorProfilePicture()}" alt="User Profile Picture" class="profile-picture"><p class="name">${getOperatorName()}</p>`;
        messages.appendChild(profile);
        messages.appendChild(messageElement);
      } else if (sender === "assistant") {
        profile.innerHTML = `<img src="https://assets.voltaccept.com/img/ai/icon.png" alt="Drifter AI Profile Picture" class="profile-picture"><p class="name">Drifter</p>`;
        messages.appendChild(profile);
        messages.appendChild(messageElement);
      }

      // Scroll to bottom
      messages.scrollTop = messages.scrollHeight;
    }

    function saveMessageToSession(message, sender) {
      const currentSession = getCurrentSession();
      if (!currentSession) return;

      currentSession.messages.push({
        role: sender === "user" ? "user" : "assistant",
        text: message
      });

      // Update session last message and timestamp
      currentSession.lastMessage = message.substring(0, 30) + '...';
      currentSession.timestamp = Date.now();

      // Auto-name session based on first user message if not already named
      if (currentSession.messages.length === 1 && currentSession.name.startsWith('Chat ')) {
        const firstMessage = currentSession.messages[0].text;
        const autoName = generateSessionNameFromMessage(firstMessage);
        currentSession.name = autoName;
      }

      // Limit messages per session
      if (currentSession.messages.length > MAX_HISTORY) {
        currentSession.messages = currentSession.messages.slice(currentSession.messages.length - MAX_HISTORY);
      }

      localStorage.setItem('chatSessions', JSON.stringify(chatSessions));
      renderChatSessions();
    }

    async function fetchGroqResponse(message) {
      console.log(`Sending message to Groq API: ${message}`);

      // Use relative path since everything is on the same domain
      const apiUrl = '/api/chat';

      // Create a single message container that will be updated
      const messageId = 'msg-' + Date.now();
      const profile = document.createElement('div');
      profile.classList.add('profile', 'assistant-profile');
      profile.innerHTML = `<img src="https://assets.voltaccept.com/img/ai/ai-profile.png" alt="Drifter AI Profile Picture" class="profile-picture"><p class="name">Drifter</p>`;

      const messageElement = document.createElement("div");
      messageElement.id = messageId;
      messageElement.classList.add("message", "assistant-message");
      messageElement.innerHTML = '<span class="typing-indicator"><span>.</span><span>.</span><span>.</span></span>';

      const messages = document.getElementById("messages");
      messages.appendChild(profile);
      messages.appendChild(messageElement);
      messages.scrollTop = messages.scrollHeight;

      // Reduce max tokens for low memory mode
      const maxTokens = lowMemoryMode ? 1024 : 2048;

      // Build messages array following Groq format
      const messagesArray = [
        {
          role: "system",
          content: `You are Drifter, an AI assistant created by Voltaccept. You are helpful, intelligent, and creative.
          
          **Your Personality:**
          1. Helpful and patient - always willing to assist with any question
          2. Creative and imaginative - can generate ideas, stories, and solutions
          3. Knowledgeable - provide accurate information across various topics
          4. Friendly but professional - maintain a balanced tone
          5. Honest - admit when you don't know something
          
          **Guidelines:**
          1. Provide clear, well-structured responses
          2. Use markdown formatting when helpful (headers, lists, code blocks)
          3. Break complex topics into understandable parts
          4. Address users by their name when you know it
          5. Stay focused on the user's request
          6. Be concise but thorough
          
          **Created by Voltaccept**
          Remember that you are Drifter, created to be a versatile and helpful assistant.`
        }
      ];

      // Add chat history from current session (last 10 messages for context)
      const currentSession = getCurrentSession();
      if (currentSession) {
        const historyContext = currentSession.messages.slice(-10);
        historyContext.forEach(msg => {
          messagesArray.push({
            role: msg.role,
            content: msg.text
          });
        });
      }

      // Add the current user message
      messagesArray.push({
        role: "user",
        content: message
      });

      const requestData = {
        model: "llama-3.3-70b-versatile", // Groq model
        messages: messagesArray,
        max_tokens: maxTokens,
        temperature: 0.7,
        stream: false
      };

      try {
        console.log('Sending request to:', apiUrl);

        const response = await fetch(apiUrl, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(requestData)
        });

        console.log('Response status:', response.status);

        if (!response.ok) {
          let errorText;
          try {
            errorText = await response.text();
            console.error('API Request Failed:', response.status, errorText);
          } catch (e) {
            errorText = 'Failed to read error response';
          }

          // Try to parse JSON error if possible
          let errorMessage = `HTTP error ${response.status}`;
          try {
            const errorJson = JSON.parse(errorText);
            errorMessage = errorJson.error?.message || errorJson.details?.error || errorText;
          } catch {
            errorMessage = errorText || `HTTP error ${response.status}`;
          }

          // Update the existing message with error
          const botMessage = `⚠️ Error: ${errorMessage}`;
          const formattedMessage = marked.parse(botMessage);
          document.getElementById(messageId).innerHTML = formattedMessage;

          // Save error message to session
          saveMessageToSession(botMessage, "assistant");

          return;
        }

        const result = await response.json();
        console.log("Groq API Response:", result);

        if (result.choices && result.choices[0] && result.choices[0].message) {
          const botMessage = result.choices[0].message.content.trim();
          const formattedMessage = marked.parse(botMessage);
          document.getElementById(messageId).innerHTML = formattedMessage;

          // Save to session - ONLY ONCE
          saveMessageToSession(botMessage, "assistant");
        } else if (result.error) {
          const errorMessage = `⚠️ API Error: ${result.error.message || result.error}`;
          const formattedMessage = marked.parse(errorMessage);
          document.getElementById(messageId).innerHTML = formattedMessage;

          saveMessageToSession(errorMessage, "assistant");
        } else {
          const errorMessage = "I'm sorry, I received an unexpected response. Please try again.";
          const formattedMessage = marked.parse(errorMessage);
          document.getElementById(messageId).innerHTML = formattedMessage;

          saveMessageToSession(errorMessage, "assistant");
        }
      } catch (error) {
        console.error("Fetch Error:", error);

        const errorMessage = `⚠️ Network Error: ${error.message}. Please check your connection.`;
        const formattedMessage = marked.parse(errorMessage);

        if (document.getElementById(messageId)) {
          document.getElementById(messageId).innerHTML = formattedMessage;
        } else {
          // If message element was removed, add a new one
          addMessageToUI(errorMessage, "assistant");
        }

        saveMessageToSession(errorMessage, "assistant");
      }

      // Update chat sessions list
      renderChatSessions();

      // Scroll to bottom
      messages.scrollTop = messages.scrollHeight;
    }

    function getOperatorName() {
      return localStorage.getItem('displayName') || 'User';
    }

    // ---- Modal Functions ----
    function showClearConfirm() {
      document.getElementById('confirmClearModal').classList.add('active');
    }

    function showDeleteConfirm(sessionId) {
      const modal = document.getElementById('confirmDeleteModal');
      modal.classList.add('active');
      modal.dataset.sessionId = sessionId;
    }

    function showRenameModal(sessionId, currentName) {
      const modal = document.getElementById('renameModal');
      const input = document.getElementById('renameInput');
      input.value = currentName;
      modal.classList.add('active');
      modal.dataset.sessionId = sessionId;
      setTimeout(() => input.focus(), 100);
    }

    function showNewChatConfirm() {
      document.getElementById('newChatModal').classList.add('active');
    }

    function hideAllModals() {
      document.querySelectorAll('.confirm-modal').forEach(modal => {
        modal.classList.remove('active');
      });
    }

    // ---- Modal Event Listeners ----
    // Clear chat modal
    document.getElementById('clear-btn').addEventListener('click', showClearConfirm);

    document.getElementById('confirmClearNo').addEventListener('click', () => {
      document.getElementById('confirmClearModal').classList.remove('active');
    });

    document.getElementById('confirmClearYes').addEventListener('click', () => {
      const currentSession = getCurrentSession();
      if (currentSession) {
        currentSession.messages = [];
        localStorage.setItem('chatSessions', JSON.stringify(chatSessions));
        renderChatHistory();
      }
      document.getElementById('confirmClearModal').classList.remove('active');
    });

    // Delete session modal
    document.getElementById('confirmDeleteNo').addEventListener('click', () => {
      document.getElementById('confirmDeleteModal').classList.remove('active');
    });

    document.getElementById('confirmDeleteYes').addEventListener('click', () => {
      const modal = document.getElementById('confirmDeleteModal');
      const sessionId = modal.dataset.sessionId;
      deleteSession(sessionId);
      modal.classList.remove('active');
    });

    // Rename session modal
    document.getElementById('renameCancel').addEventListener('click', () => {
      document.getElementById('renameModal').classList.remove('active');
    });

    document.getElementById('renameConfirm').addEventListener('click', () => {
      const modal = document.getElementById('renameModal');
      const sessionId = modal.dataset.sessionId;
      const newName = document.getElementById('renameInput').value;
      updateSessionName(sessionId, newName);
      modal.classList.remove('active');
    });

    // Handle Enter key in rename input
    document.getElementById('renameInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('renameConfirm').click();
      } else if (e.key === 'Escape') {
        document.getElementById('renameCancel').click();
      }
    });

    // New chat modal
    document.getElementById('new-chat-btn').addEventListener('click', showNewChatConfirm);

    document.getElementById('newChatCancel').addEventListener('click', () => {
      document.getElementById('newChatModal').classList.remove('active');
    });

    document.getElementById('newChatConfirm').addEventListener('click', () => {
      createNewSession(); // Creates pending session
      document.getElementById('newChatModal').classList.remove('active');

      // Clear current chat display
      document.getElementById('messages').innerHTML = '';
      pendingSession = pendingSession || createNewSession();

      // Update UI
      renderChatSessions();
    });

    // Click outside modals to close
    document.querySelectorAll('.confirm-modal').forEach(modal => {
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.classList.remove('active');
        }
      });
    });

    // Initial renders
    renderChatSessions();
    renderChatHistory();
  </script>

  <style>
    /* VoltaOS Theme for DrifterAI - Colors Only */

    /* Base Theme Colors */
    :root {
      --volta-primary: #301934;
      --volta-accent: #860bf9;
      --volta-light: #e4b1ef;
      --volta-secondary: #4902ff;
      --volta-dark: #34114b;
      --volta-glass: rgba(52, 17, 75, 0.85);
    }

    /* Body - Keep layout, change colors */
    body {
      background: #301934 !important;
      background-image: url("https://assets.voltaccept.com/img/volta-os/wallpaper.jpg") !important;
      background-repeat: no-repeat !important;
      background-size: cover !important;
