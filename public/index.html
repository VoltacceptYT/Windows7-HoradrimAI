<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoltaOS Desktop Environment</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #301934;
            background-image: url("assets/img/wallpaper.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Desktop Styles */
        #desktop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 60px);
            z-index: 1;
            overflow: hidden;
        }

        /* Windows 11 Acrylic Taskbar */
        #taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(48, 25, 52, 0.65);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-top: 1px solid rgba(187, 79, 246, 0.08);
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 2000;
            box-shadow: 0 -1px 6px rgba(0, 0, 0, 0.15);
        }

        #taskbar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: linear-gradient(to bottom,
                    rgba(228, 177, 239, 0.05) 0%,
                    rgba(228, 177, 239, 0.01) 100%);
            pointer-events: none;
            z-index: -1;
        }

        .taskbar-apps {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            overflow-x: auto;
            padding: 0 10px;
            scrollbar-width: thin;
            scrollbar-color: rgba(150, 33, 233, 0.6) transparent;
        }

        .taskbar-apps::-webkit-scrollbar {
            height: 4px;
        }

        .taskbar-apps::-webkit-scrollbar-track {
            background: transparent;
        }

        .taskbar-apps::-webkit-scrollbar-thumb {
            background-color: rgba(150, 33, 233, 0.6);
            border-radius: 2px;
        }

        .taskbar-app {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            flex-shrink: 0;
        }

        .taskbar-app:hover {
            background: rgba(134, 11, 249, 0.3);
        }

        .taskbar-app.active {
            background: rgba(134, 11, 249, 0.4);
            border: 1px solid rgba(228, 177, 239, 0.6);
            box-shadow: 0 0 8px rgba(134, 11, 249, 0.4);
        }

        .taskbar-app.open {
            border-bottom: 3px solid #860bf9;
        }

        .taskbar-app-icon {
            width: 32px;
            height: 32px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            pointer-events: none;
        }

        .taskbar-system-tray {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-left: 20px;
            border-left: 1px solid rgba(228, 177, 239, 0.1);
            height: 60%;
        }

        .system-tray-item {
            color: rgba(228, 177, 239, 0.8);
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: default;
        }

        .system-tray-item:hover {
            background: rgba(228, 177, 239, 0.1);
        }

        .clock {
            font-weight: 600;
            color: rgba(228, 177, 239, 0.9);
        }

        /* App Window Styles - Purple Acrylic */
        .app-window {
            position: fixed;
            width: 726px;
            height: 482px;
            background: rgba(52, 17, 75, 0.75);
            backdrop-filter: blur(16px) saturate(160%) brightness(1.05);
            -webkit-backdrop-filter: blur(16px) saturate(160%) brightness(1.05);
            border: 1px solid rgba(187, 79, 246, 0.4);
            border-radius: 10px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(134, 11, 249, 0.1) inset;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            min-height: 0;
            resize: both;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        .app-header {
            background: linear-gradient(to bottom, rgba(228, 177, 239, 0.15), rgba(187, 79, 246, 0.1));
            padding: 8px 12px;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(187, 79, 246, 0.3);
            user-select: none;
            flex-shrink: 0;
            border-radius: 10px 10px 0 0;
        }

        .app-titlebar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-title {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .app-title-icon {
            width: 16px;
            height: 16px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: inline-block;
            flex-shrink: 0;
            image-rendering: auto;
            pointer-events: none;
            user-drag: none;
            -webkit-user-drag: none;
        }

        .app-title span {
            font-weight: 600;
            color: rgba(228, 177, 239, 0.9);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .app-button {
            width: 26px;
            height: 26px;
            border: 1px solid #650ec0;
            border-radius: 50%;
            background: linear-gradient(to bottom, #e4b1ef, #ce7bf5);
            box-shadow: inset 0 1px 0 rgba(228, 177, 239, 0.6);
            color: #480d8d;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-button:hover {
            background: linear-gradient(to bottom, #ce7bf5, #bb4ff6);
        }

        .app-controls {
            position: absolute;
            top: 0;
            right: 5px;
            display: flex;
        }

        .app-close {
            background: linear-gradient(to bottom, #bb4ff6, #9621e9);
            color: #480d8d;
            border: 1px solid #650ec0;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
            border-bottom-left-radius: 3px;
            border-bottom-right-radius: 3px;
            font-weight: bold;
            text-shadow: 0 -1px 0 #34114b;
            width: 52px;
            height: 18px;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 10px;
            margin-right: 2.5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-close:hover {
            background: linear-gradient(to bottom, #ce7bf5, #860bf9);
        }

        /* Desktop Icon Styles */
        .desktop-icon {
            position: absolute;
            width: 80px;
            text-align: center;
            font-size: 13px;
            font-family: 'Segoe UI', sans-serif;
            color: #e4b1ef;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.7);
            cursor: default;
            z-index: 2;
            user-select: none;
            padding: 8px 4px;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .desktop-icon:hover {
            background: rgba(134, 11, 249, 0.15);
        }

        .desktop-icon:active {
            background: rgba(134, 11, 249, 0.25);
        }

        .desktop-icon-img {
            width: 48px;
            height: 48px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin-bottom: 6px;
            display: inline-block;
            pointer-events: none;
            user-drag: none;
            -webkit-user-drag: none;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .desktop-icon div {
            padding: 2px;
            border-radius: 2px;
        }

        /* App Browser Styles */
        .app-browser {
            flex: 1;
            width: 100%;
            border: none;
            min-height: 0;
            background: rgba(228, 177, 239, 0.95);
            border-radius: 0 0 10px 10px;
        }

        /* App Minimized State */
        .app-window.minimized {
            display: none;
        }

        /* Window Z-index Management */
        .app-window.active {
            z-index: 1001;
            border-color: rgba(228, 177, 239, 0.6);
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(228, 177, 239, 0.2) inset,
                0 0 20px rgba(134, 11, 249, 0.3);
        }

        /* Grid snapping for icons */
        .grid-snap {
            transition: left 0.1s, top 0.1s;
        }

        /* Alert Window Styles - Purple Acrylic */
        .alert-window {
            position: fixed;
            width: 400px;
            height: 180px;
            background: rgba(52, 17, 75, 0.85);
            backdrop-filter: blur(16px) saturate(160%) brightness(1.05);
            -webkit-backdrop-filter: blur(16px) saturate(160%) brightness(1.05);
            border: 1px solid rgba(187, 79, 246, 0.5);
            border-radius: 10px;
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(134, 11, 249, 0.2) inset;
            z-index: 3000;
            display: none;
            flex-direction: column;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            resize: none;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }

        .alert-header {
            background: linear-gradient(to bottom, rgba(228, 177, 239, 0.15), rgba(187, 79, 246, 0.1));
            padding: 12px 16px;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(187, 79, 246, 0.3);
            border-radius: 10px 10px 0 0;
            user-select: none;
            flex-shrink: 0;
        }

        .alert-title {
            font-weight: 600;
            color: rgba(228, 177, 239, 0.9);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .alert-title-icon {
            width: 16px;
            height: 16px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23e4b1ef"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.3));
        }

        .alert-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: rgba(228, 177, 239, 0.9);
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
            background: rgba(0, 0, 0, 0.1);
        }

        .alert-close {
            background: linear-gradient(to bottom, #bb4ff6, #860bf9);
            color: #e4b1ef;
            border: 1px solid #650ec0;
            border-radius: 6px;
            font-weight: 600;
            width: 80px;
            height: 36px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            transition: all 0.2s ease;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .alert-close:hover {
            background: linear-gradient(to bottom, #ce7bf5, #9621e9);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .alert-controls {
            position: absolute;
            top: 0;
            right: 5px;
            display: flex;
        }

        .alert-close-button {
            background: linear-gradient(to bottom, #bb4ff6, #860bf9);
            color: #480d8d;
            border: 1px solid #650ec0;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
            border-bottom-left-radius: 3px;
            border-bottom-right-radius: 3px;
            font-weight: bold;
            text-shadow: 0 -1px 0 #34114b;
            width: 52px;
            height: 18px;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 10px;
            margin-right: 2.5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .alert-close-button:hover {
            background: linear-gradient(to bottom, #ce7bf5, #9621e9);
        }

        /* Loading Screen Styles */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(48, 25, 52, 0.98);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loading-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 20% 30%, rgba(134, 11, 249, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(187, 79, 246, 0.1) 0%, transparent 50%);
            backdrop-filter: blur(10px);
            z-index: -1;
        }

        .loading-content {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            background: rgba(52, 17, 75, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 12px;
            border: 1px solid rgba(187, 79, 246, 0.3);
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(228, 177, 239, 0.05);
            animation: subtle-float 4s ease-in-out infinite;
        }

        @keyframes subtle-float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .loading-logo {
            margin-bottom: 30px;
        }

        .loading-logo svg {
            filter: drop-shadow(0 0 10px rgba(134, 11, 249, 0.4));
        }

        .loading-logo svg circle {
            stroke: rgba(134, 11, 249, 0.9);
        }

        .loading-logo svg circle:nth-child(2) {
            stroke: rgba(150, 33, 233, 0.7);
        }

        .loading-text h1 {
            font-size: 42px;
            font-weight: 300;
            background: linear-gradient(135deg, #e4b1ef 0%, #860bf9 50%, #4902ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .loading-text p {
            color: rgba(228, 177, 239, 0.8);
            font-size: 16px;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .loading-progress {
            width: 100%;
            margin: 30px 0;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(228, 177, 239, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #860bf9, #e4b1ef);
            border-radius: 3px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(134, 11, 249, 0.5);
        }

        .progress-text {
            color: rgba(228, 177, 239, 0.9);
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .loading-hint {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(228, 177, 239, 0.1);
            color: rgba(228, 177, 239, 0.6);
            font-size: 13px;
            font-style: italic;
        }

        /* Scrollbar styling for app windows */
        .app-browser::-webkit-scrollbar {
            width: 10px;
        }

        .app-browser::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }

        .app-browser::-webkit-scrollbar-thumb {
            background: rgba(134, 11, 249, 0.5);
            border-radius: 4px;
            border: 2px solid transparent;
            background-clip: content-box;
        }

        .app-browser::-webkit-scrollbar-thumb:hover {
            background: rgba(150, 33, 233, 0.6);
            background-clip: content-box;
        }

        /* Selection styling */
        ::selection {
            background: rgba(134, 11, 249, 0.5);
            color: #e4b1ef;
        }

        /* Focus outlines */
        :focus {
            outline: 2px solid rgba(134, 11, 249, 0.5);
            outline-offset: 2px;
        }
    </style>
</head>

<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="loading-logo">
                <svg width="80" height="80" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(120, 160, 220, 0.9)" stroke-width="3"
                        stroke-linecap="round">
                        <animate attributeName="stroke-dasharray" values="0 300; 282 300; 0 300" dur="2.5s"
                            repeatCount="indefinite" />
                        <animate attributeName="stroke-dashoffset" values="0; -282; -564" dur="2.5s"
                            repeatCount="indefinite" />
                    </circle>
                    <circle cx="50" cy="50" r="35" fill="none" stroke="rgba(100, 140, 200, 0.7)" stroke-width="2"
                        stroke-linecap="round">
                        <animate attributeName="stroke-dasharray" values="0 220; 220 220; 0 220" dur="2s"
                            repeatCount="indefinite" begin="0.2s" />
                        <animate attributeName="stroke-dashoffset" values="0; -220; -440" dur="2s"
                            repeatCount="indefinite" begin="0.2s" />
                    </circle>
                </svg>
            </div>
            <div class="loading-text">
                <h1>VoltaOS</h1>
                <p>Initializing Desktop Environment...</p>
            </div>
            <div class="loading-progress">
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
                <div class="progress-text" id="loading-percentage">0%</div>
            </div>
            <div class="loading-hint">
                <span>Tip: Double-click desktop icons to launch applications</span>
            </div>
        </div>
        <div class="loading-background"></div>
    </div>

    <!-- Desktop -->
    <div id="desktop"></div>

    <!-- Taskbar -->
    <div id="taskbar">
        <div class="taskbar-apps" id="taskbar-apps">
            <!-- Taskbar apps will be added here dynamically -->
        </div>

        <div class="taskbar-system-tray">
            <div class="system-tray-item clock" id="clock">--:--</div>
        </div>
    </div>

    <script>
        // Loading Screen Management
        function initLoadingScreen() {
            const loadingScreen = document.getElementById('loading-screen');
            const progressFill = document.querySelector('.progress-fill');
            const percentageText = document.getElementById('loading-percentage');

            // Simulate loading progress
            let progress = 0;
            const totalSteps = 7; // Changed from 5 to 7
            let currentStep = 0;

            function updateProgress(stepName) {
                currentStep++;
                progress = (currentStep / totalSteps) * 100;
                progressFill.style.width = `${progress}%`;
                percentageText.textContent = `${Math.round(progress)}%`;

                // Optional: Update loading text based on step
                const loadingText = document.querySelector('.loading-text p');
                const steps = [
                    'Booting...',
                    'Initializing Desktop Environment...',
                    'Setting up application manager...',
                    'Preparing alert system...',
                    'Starting system clock...',
                    'Registering applications...',
                    'Finalizing setup...'
                ];
                if (currentStep < steps.length) {
                    loadingText.textContent = steps[currentStep - 1];
                }
            }

            // Update progress as initialization happens
            const originalDOMContentLoaded = document.addEventListener('DOMContentLoaded', () => {
                // Step 1: Initial setup
                updateProgress('Starting...');

                // Override alert system creation to track progress
                const originalAlertSystem = window.alertSystem;
                alertSystem = new AlertWindow();
                updateProgress('Alert System');

                // Override app manager creation to track progress
                const originalAppManager = window.appManager;
                window.appManager = new AppManager();
                updateProgress('App Manager');

                // Initialize clock
                updateClock();
                updateProgress('System Clock');

                // Register apps
                const horadrimAI = window.appManager.registerApp({
                    id: 'horadrimai',
                    title: 'HoradrimAI',
                    iconUrl: 'https://horadrimai.vercel.app/chat/assets/icon.png',
                    url: 'https://horadrimai.vercel.app/chat/',
                    windowPosition: { top: 100, left: 100 },
                    windowSize: { width: 726, height: 482 }
                });
                updateProgress('Applications');

                // Set up event listeners
                document.addEventListener('mousedown', (e) => {
                    // ... (existing code)
                });

                // Final step
                setTimeout(() => {
                    updateProgress('Finalizing');

                    // Hide loading screen with fade out
                    setTimeout(() => {
                        loadingScreen.classList.add('fade-out');
                        setTimeout(() => {
                            loadingScreen.style.display = 'none';

                            // Optional: Play a subtle sound or animation
                            if (horadrimAI) {
                                setTimeout(() => {
                                    // Show a welcome alert
                                    alertSystem.showAlert('Welcome to VoltaOS Desktop Environment. Double-click the HoradrimAI icon to begin.');
                                }, 500);
                            }
                        }, 800);
                    }, 300);
                }, 300);

                // Update clock every second
                setInterval(updateClock, 1000);
            });

            // Start initial progress immediately
            setTimeout(() => updateProgress('Booting'), 100);
        }

        // Alert System as a movable window
        class AlertWindow {
            constructor() {
                this.windowElement = null;
                this.isOpen = false;
                this.isActive = false;
                this.createWindow();
            }

            createWindow() {
                this.windowElement = document.createElement('div');
                this.windowElement.className = 'alert-window';
                this.windowElement.id = 'alert-window-instance';

                this.windowElement.innerHTML = `
                    <div class="alert-header">
                        <div class="alert-title">
                            <span class="alert-title-icon"></span>
                            <span>Application Alert</span>
                        </div>
                        <div class="alert-controls">
                            <button class="alert-close-button" id="alert-window-close">
                                <svg fill="currentColor" xmlns="http://www.w3.org/2000/svg" width="12px" height="12px" viewBox="0 0 52 52" xml:space="preserve">
                                    <path d="m31 25.4 13-13.1c.6-.6.6-1.5 0-2.1l-2-2.1c-.6-.6-1.5-.6-2.1 0L26.8 21.2c-.4.4-1 .4-1.4 0L12.3 8c-.6-.6-1.5-.6-2.1 0l-2.1 2.1c-.6.6-.6 1.5 0 2.1l13.1 13.1c.4.4.4 1 0 1.4L8 39.9c-.6.6-.6 1.5 0 2.1l2.1 2.1c.6.6 1.5.6 2.1 0L25.3 31c.4-.4 1-.4 1.4 0l13.1 13.1c.6.6 1.5.6 2.1 0L44 42c.6-.6.6-1.5 0-2.1L31 26.8c-.4-.4-.4-1 0-1.4"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="alert-content" id="alert-window-message">
                        <!-- Message will be inserted here -->
                    </div>
                    <button class="alert-close" id="alert-window-ok">OK</button>
                `;

                document.body.appendChild(this.windowElement);

                // Make it draggable
                this.makeDraggable();

                // Add event listeners
                document.getElementById('alert-window-close').addEventListener('click', () => this.close());
                document.getElementById('alert-window-ok').addEventListener('click', () => this.close());

                // Bring to front when clicked
                this.windowElement.addEventListener('mousedown', () => this.bringToFront());

                // Initially hidden
                this.windowElement.style.display = 'none';
            }

            makeDraggable() {
                const header = this.windowElement.querySelector('.alert-header');
                let dragging = false;
                let offsetX = 0;
                let offsetY = 0;

                header.addEventListener('mousedown', (e) => {
                    dragging = true;

                    // Get the current computed position, accounting for transform
                    const rect = this.windowElement.getBoundingClientRect();

                    // Calculate offsets based on actual screen position, not offsetLeft/Top
                    offsetX = e.clientX - rect.left;
                    offsetY = e.clientY - rect.top;

                    // Remove transform immediately when starting to drag
                    this.windowElement.style.transform = 'none';
                    this.windowElement.style.left = `${rect.left}px`;
                    this.windowElement.style.top = `${rect.top}px`;

                    e.preventDefault();
                    this.bringToFront();
                });

                document.addEventListener('mousemove', (e) => {
                    if (dragging) {
                        this.windowElement.style.left = `${e.clientX - offsetX}px`;
                        this.windowElement.style.top = `${e.clientY - offsetY}px`;
                    }
                });

                document.addEventListener('mouseup', () => {
                    dragging = false;
                });
            }

            showAlert(message) {
                const alertMessage = document.getElementById('alert-window-message');
                alertMessage.textContent = message;

                // Center the window if it's the first time showing
                if (!this.isOpen) {
                    this.windowElement.style.top = '50%';
                    this.windowElement.style.left = '50%';
                    this.windowElement.style.transform = 'translate(-50%, -50%)';
                }

                this.windowElement.style.display = 'flex';
                this.isOpen = true;
                this.bringToFront();
            }

            close() {
                this.windowElement.style.display = 'none';
                this.isOpen = false;
                this.isActive = false;
            }

            bringToFront() {
                // Remove active class from all windows and alerts
                document.querySelectorAll('.app-window, .alert-window').forEach(window => {
                    window.classList.remove('active');
                });

                // Add active class to this window
                this.windowElement.classList.add('active');
                this.isActive = true;

                // Set high z-index
                const windows = document.querySelectorAll('.app-window, .alert-window');
                let highestZ = 1000;
                windows.forEach(window => {
                    const z = parseInt(window.style.zIndex) || 1000;
                    if (z > highestZ) highestZ = z;
                });

                this.windowElement.style.zIndex = highestZ + 1;
            }
        }

        // Global alert system instance
        let alertSystem = null;

        class DesktopApp {
            constructor(config, appManager) {
                this.id = config.id || `app-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
                this.title = config.title || "Untitled App";
                this.iconUrl = config.iconUrl || "";
                this.url = config.url || "";
                this.windowPosition = config.windowPosition || { top: 100, left: 100 };
                this.iconPosition = config.iconPosition || { top: 64, left: 64 };
                this.windowSize = config.windowSize || { width: 726, height: 482 };
                this.appManager = appManager;

                this.windowElement = null;
                this.iconElement = null;
                this.taskbarElement = null;
                this.isOpen = false;
                this.isMinimized = false;
                this.isActive = false;

                this.createIcon();
                this.createWindow();
                this.createTaskbarItem();
            }

            createIcon() {
                this.iconElement = document.createElement('div');
                this.iconElement.className = 'desktop-icon';
                this.iconElement.id = `${this.id}-icon`;
                this.iconElement.style.top = `${this.iconPosition.top}px`;
                this.iconElement.style.left = `${this.iconPosition.left}px`;

                this.iconElement.innerHTML = `
                    <div class="desktop-icon-img" style="background-image: url('${this.iconUrl}')"></div>
                    <div>${this.title}</div>
                `;

                this.iconElement.addEventListener('dblclick', () => this.open());
                this.makeIconDraggable();

                document.getElementById('desktop').appendChild(this.iconElement);
            }

            createWindow() {
                this.windowElement = document.createElement('div');
                this.windowElement.className = 'app-window';
                this.windowElement.id = `${this.id}-window`;
                this.windowElement.style.top = `${this.windowPosition.top}px`;
                this.windowElement.style.left = `${this.windowPosition.left}px`;
                this.windowElement.style.width = `${this.windowSize.width}px`;
                this.windowElement.style.height = `${this.windowSize.height}px`;

                this.windowElement.innerHTML = `
                    <div class="app-header">
                        <div class="app-titlebar">
                            <div class="app-title">
                                <span class="app-title-icon" style="background-image: url('${this.iconUrl}')"></span>
                                <span>${this.title}</span>
                            </div>
                        </div>
                        <div class="app-controls">
                            <button class="app-close" id="${this.id}-close">
                                <svg fill="currentColor" xmlns="http://www.w3.org/2000/svg" width="12px" height="12px" viewBox="0 0 52 52" xml:space="preserve">
                                    <path d="m31 25.4 13-13.1c.6-.6.6-1.5 0-2.1l-2-2.1c-.6-.6-1.5-.6-2.1 0L26.8 21.2c-.4.4-1 .4-1.4 0L12.3 8c-.6-.6-1.5-.6-2.1 0l-2.1 2.1c-.6.6-.6 1.5 0 2.1l13.1 13.1c.4.4.4 1 0 1.4L8 39.9c-.6.6-.6 1.5 0 2.1l2.1 2.1c.6.6 1.5.6 2.1 0L25.3 31c.4-.4 1-.4 1.4 0l13.1 13.1c.6.6 1.5.6 2.1 0L44 42c.6-.6.6-1.5 0-2.1L31 26.8c-.4-.4-.4-1 0-1.4"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <iframe class="app-browser" src="${this.url}"></iframe>
                `;

                this.makeWindowDraggable();
                this.makeWindowResizable();

                document.body.appendChild(this.windowElement);
                this.windowElement.style.display = 'none';

                // Add close button event
                document.getElementById(`${this.id}-close`).addEventListener('click', () => this.close());

                // Bring window to front when clicked
                this.windowElement.addEventListener('mousedown', () => this.bringToFront());
            }

            createTaskbarItem() {
                this.taskbarElement = document.createElement('div');
                this.taskbarElement.className = 'taskbar-app';
                this.taskbarElement.id = `${this.id}-taskbar`;
                this.taskbarElement.dataset.appId = this.id;
                this.taskbarElement.title = this.title; // Tooltip on hover

                this.taskbarElement.innerHTML = `
                    <div class="taskbar-app-icon" style="background-image: url('${this.iconUrl}')"></div>
                `;

                this.taskbarElement.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.handleTaskbarClick();
                });

                document.getElementById('taskbar-apps').appendChild(this.taskbarElement);
            }

            handleTaskbarClick() {
                if (!this.isOpen) {
                    this.open();
                } else if (this.isMinimized) {
                    this.restore();
                } else {
                    // If app is already open and active, show alert
                    if (this.isActive) {
                        alertSystem.showAlert(`The Requested Application, ${this.title}, Is Already Open...`);
                    } else {
                        this.bringToFront();
                    }
                }
            }

            updateTaskbarState() {
                if (!this.taskbarElement) return;

                // Update classes based on state
                if (this.isOpen) {
                    this.taskbarElement.classList.add('open');
                } else {
                    this.taskbarElement.classList.remove('open');
                }

                if (this.isActive) {
                    this.taskbarElement.classList.add('active');
                } else {
                    this.taskbarElement.classList.remove('active');
                }
            }

            makeIconDraggable() {
                const GRID_SIZE = 64;
                let dragging = false;
                let offsetX = 0;
                let offsetY = 0;

                this.iconElement.addEventListener('mousedown', (e) => {
                    dragging = true;
                    offsetX = e.clientX - this.iconElement.offsetLeft;
                    offsetY = e.clientY - this.iconElement.offsetTop;
                    e.preventDefault();
                    this.bringToFront();
                });

                document.addEventListener('mousemove', (e) => {
                    if (dragging) {
                        const x = Math.round((e.clientX - offsetX) / GRID_SIZE) * GRID_SIZE;
                        const y = Math.round((e.clientY - offsetY) / GRID_SIZE) * GRID_SIZE;
                        this.iconElement.style.left = `${x}px`;
                        this.iconElement.style.top = `${y}px`;
                        this.iconPosition = { top: y, left: x };
                    }
                });

                document.addEventListener('mouseup', () => {
                    dragging = false;
                });
            }

            makeWindowDraggable() {
                const header = this.windowElement.querySelector('.app-header');
                let dragging = false;
                let offsetX = 0;
                let offsetY = 0;

                header.addEventListener('mousedown', (e) => {
                    dragging = true;
                    offsetX = e.clientX - this.windowElement.offsetLeft;
                    offsetY = e.clientY - this.windowElement.offsetTop;
                    e.preventDefault();
                    this.bringToFront();
                });

                document.addEventListener('mousemove', (e) => {
                    if (dragging) {
                        this.windowElement.style.left = `${e.clientX - offsetX}px`;
                        this.windowElement.style.top = `${e.clientY - offsetY}px`;
                        this.windowPosition = {
                            top: e.clientY - offsetY,
                            left: e.clientX - offsetX
                        };
                    }
                });

                document.addEventListener('mouseup', () => {
                    dragging = false;
                });
            }

            makeWindowResizable() {
                this.windowElement.addEventListener('mousedown', (e) => {
                    if (e.target === this.windowElement) {
                        const startWidth = this.windowElement.offsetWidth;
                        const startHeight = this.windowElement.offsetHeight;
                        const startX = e.clientX;
                        const startY = e.clientY;

                        function onMouseMove(e) {
                            this.windowElement.style.width = `${startWidth + (e.clientX - startX)}px`;
                            this.windowElement.style.height = `${startHeight + (e.clientY - startY)}px`;
                            this.windowSize = {
                                width: startWidth + (e.clientX - startX),
                                height: startHeight + (e.clientY - startY)
                            };
                        }

                        function onMouseUp() {
                            document.removeEventListener('mousemove', onMouseMove.bind(this));
                            document.removeEventListener('mouseup', onMouseUp);
                        }

                        document.addEventListener('mousemove', onMouseMove.bind(this));
                        document.addEventListener('mouseup', onMouseUp);

                        e.preventDefault();
                    }
                });
            }

            open() {
                // Check if already open
                if (this.isOpen && !this.isMinimized) {
                    alertSystem.showAlert(`The Requested Application, ${this.title}, Is Already Open...`);
                    this.bringToFront();
                    return;
                }

                this.windowElement.style.display = 'flex';
                this.isOpen = true;
                this.isMinimized = false;
                this.bringToFront();
                this.updateTaskbarState();
            }

            close() {
                this.windowElement.style.display = 'none';
                this.isOpen = false;
                this.isActive = false;
                this.updateTaskbarState();
            }

            minimize() {
                this.windowElement.style.display = 'none';
                this.isMinimized = true;
                this.updateTaskbarState();
            }

            restore() {
                this.windowElement.style.display = 'flex';
                this.isMinimized = false;
                this.bringToFront();
                this.updateTaskbarState();
            }

            bringToFront() {
                // Deactivate all apps
                this.appManager.deactivateAllApps();

                // Activate this app
                this.isActive = true;

                // Remove active class from all windows
                document.querySelectorAll('.app-window').forEach(window => {
                    window.classList.remove('active');
                });

                // Add active class to this window
                this.windowElement.classList.add('active');

                // Set high z-index
                const windows = document.querySelectorAll('.app-window');
                let highestZ = 1000;
                windows.forEach(window => {
                    const z = parseInt(window.style.zIndex) || 1000;
                    if (z > highestZ) highestZ = z;
                });

                this.windowElement.style.zIndex = highestZ + 1;

                // Update taskbar state
                this.updateTaskbarState();
            }

            destroy() {
                if (this.windowElement) {
                    this.windowElement.remove();
                }
                if (this.iconElement) {
                    this.iconElement.remove();
                }
                if (this.taskbarElement) {
                    this.taskbarElement.remove();
                }
            }
        }

        // App Manager to handle multiple apps
        class AppManager {
            constructor() {
                this.apps = new Map();
                this.nextIconPosition = { top: 64, left: 64 };
                this.activeAppId = null;
            }

            registerApp(config) {
                // Set default position for new icon
                const iconConfig = {
                    ...config,
                    iconPosition: { ...this.nextIconPosition }
                };

                const app = new DesktopApp(iconConfig, this);
                this.apps.set(app.id, app);

                // Update next icon position (stagger them)
                this.nextIconPosition.left += 80;
                if (this.nextIconPosition.left > 500) {
                    this.nextIconPosition.left = 64;
                    this.nextIconPosition.top += 80;
                }

                return app;
            }

            getApp(appId) {
                return this.apps.get(appId);
            }

            deactivateAllApps() {
                this.apps.forEach(app => {
                    app.isActive = false;
                    app.updateTaskbarState();
                });
                this.activeAppId = null;
            }

            setActiveApp(appId) {
                this.deactivateAllApps();
                const app = this.getApp(appId);
                if (app) {
                    app.isActive = true;
                    app.updateTaskbarState();
                    this.activeAppId = appId;
                }
            }

            removeApp(appId) {
                const app = this.apps.get(appId);
                if (app) {
                    app.destroy();
                    this.apps.delete(appId);
                }
            }

            getAllApps() {
                return Array.from(this.apps.values());
            }

            closeAllApps() {
                this.apps.forEach(app => app.close());
            }
        }

        // Clock function for taskbar - updates only on minute change
        let lastMinute = null;

        function updateClock() {
            const now = new Date();
            const currentMinute = now.getMinutes();

            // Only update if minute has changed
            if (currentMinute !== lastMinute) {
                lastMinute = currentMinute;
                const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                document.getElementById('clock').textContent = timeString;
            }
        }

        // Initialize loading screen when the script loads
        initLoadingScreen();
    </script>
