<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Fullscreen meta tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#301934">
    <title>VoltaOS Mobile</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #301934;
        }

        body {
            background-image: url("assets/img/wallpaper.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            width: 100vw;
        }

        /* Mobile Status Bar */
        #status-bar {
            position: fixed;
            top: env(safe-area-inset-top, 0);
            left: 0;
            width: 100%;
            height: 44px;
            background: rgba(48, 25, 52, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 3000;
            border-bottom: 1px solid rgba(187, 79, 246, 0.2);
        }

        .status-time {
            color: rgba(228, 177, 239, 0.95);
            font-size: 15px;
            font-weight: 600;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(228, 177, 239, 0.95);
            font-size: 14px;
        }

        .status-icons i {
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.3));
        }

        .battery-level {
            font-size: 14px;
            color: rgba(228, 177, 239, 0.95);
        }

        /* Mobile Dock */
        #mobile-dock {
            position: fixed;
            bottom: env(safe-area-inset-bottom, 0);
            left: 0;
            width: 100%;
            height: 80px;
            background: rgba(48, 25, 52, 0.8);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid rgba(187, 79, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 16px;
            z-index: 2000;
        }

        .dock-app {
            width: 60px;
            height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            transition: all 0.2s ease;
            position: relative;
        }

        .dock-app.active {
            background: rgba(134, 11, 249, 0.3);
            transform: translateY(-8px);
        }

        .dock-app:active {
            transform: scale(0.95);
        }

        .dock-icon {
            font-size: 24px;
            color: rgba(228, 177, 239, 0.95);
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .dock-label {
            color: rgba(228, 177, 239, 0.9);
            font-size: 11px;
            text-align: center;
            font-weight: 500;
        }

        /* Home Screen */
        #home-screen {
            position: fixed;
            top: calc(44px + env(safe-area-inset-top, 0));
            left: 0;
            width: 100%;
            height: calc(100vh - 124px - env(safe-area-inset-top, 0) - env(safe-area-inset-bottom, 0));
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 1;
            padding: 20px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        #home-screen::-webkit-scrollbar {
            display: none;
        }

        /* Mobile App Grid */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .mobile-app {
            width: 100%;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            background: rgba(72, 13, 141, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(187, 79, 246, 0.2);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .mobile-app:active {
            background: rgba(96, 21, 189, 0.6);
            transform: scale(0.95);
        }

        .mobile-app-icon {
            width: 56px;
            height: 56px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
            border-radius: 12px;
        }

        .mobile-app-label {
            color: rgba(228, 177, 239, 0.95);
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            padding: 0 4px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Mobile App Window (Full Screen) */
        .mobile-window {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(52, 17, 75, 0.98);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 4000;
            display: none;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mobile-window.active {
            display: flex;
            transform: translateY(0);
        }

        .mobile-window-header {
            height: 60px;
            background: rgba(48, 25, 52, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(187, 79, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: relative;
            flex-shrink: 0;
            padding-top: env(safe-area-inset-top, 0);
        }

        .mobile-window-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mobile-window-icon {
            width: 28px;
            height: 28px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.4));
            border-radius: 6px;
        }

        .mobile-window-label {
            color: rgba(228, 177, 239, 0.95);
            font-size: 17px;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        }

        .mobile-window-close {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(72, 13, 141, 0.4);
            border: 1px solid rgba(187, 79, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(228, 177, 239, 0.9);
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mobile-window-close:active {
            background: rgba(96, 21, 189, 0.6);
            transform: scale(0.9);
        }

        .mobile-window-content {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .mobile-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        /* Recent Apps Modal */
        #recent-apps-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(48, 25, 52, 0.95);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            z-index: 5000;
            display: none;
            flex-direction: column;
            padding: 20px;
            padding-top: calc(44px + env(safe-area-inset-top, 0));
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #recent-apps-modal.active {
            display: flex;
            transform: translateY(0);
        }

        .recent-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(187, 79, 246, 0.2);
        }

        .recent-title {
            color: rgba(228, 177, 239, 0.95);
            font-size: 24px;
            font-weight: 600;
        }

        .recent-close {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(72, 13, 141, 0.4);
            border: 1px solid rgba(187, 79, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(228, 177, 239, 0.9);
            font-size: 22px;
            cursor: pointer;
        }

        .recent-close:active {
            background: rgba(96, 21, 189, 0.6);
            transform: scale(0.9);
        }

        #recent-apps-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 20px;
        }

        .recent-app-item {
            background: rgba(72, 13, 141, 0.4);
            border: 1px solid rgba(187, 79, 246, 0.2);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .recent-app-item:active {
            background: rgba(96, 21, 189, 0.6);
            transform: scale(0.98);
        }

        .recent-app-icon {
            width: 40px;
            height: 40px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 8px;
        }

        .recent-app-info {
            flex: 1;
        }

        .recent-app-name {
            color: rgba(228, 177, 239, 0.95);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .recent-app-time {
            color: rgba(228, 177, 239, 0.7);
            font-size: 12px;
        }

        .no-recent-apps {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            color: rgba(228, 177, 239, 0.5);
            font-size: 16px;
        }

        .no-recent-apps i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* Mobile Notifications */
        .mobile-notification {
            position: fixed;
            top: calc(60px + env(safe-area-inset-top, 0));
            left: 50%;
            transform: translateX(-50%) translateY(-150%);
            width: 90%;
            max-width: 400px;
            background: rgba(52, 17, 75, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(187, 79, 246, 0.3);
            border-radius: 16px;
            padding: 20px;
            z-index: 5000;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            opacity: 0;
            pointer-events: none;
        }

        .mobile-notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .notification-title {
            color: rgba(228, 177, 239, 0.95);
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .notification-title i {
            font-size: 18px;
        }

        .notification-message {
            color: rgba(228, 177, 239, 0.8);
            font-size: 15px;
            line-height: 1.4;
        }

        /* Mobile Loading Screen */
        #mobile-loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(48, 25, 52, 0.98);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        .mobile-loading-content {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .mobile-loading-logo {
            margin-bottom: 30px;
        }

        .mobile-loading-logo i {
            font-size: 80px;
            color: rgba(134, 11, 249, 0.9);
            filter: drop-shadow(0 0 10px rgba(134, 11, 249, 0.4));
        }

        .mobile-loading-text h1 {
            font-size: 32px;
            font-weight: 300;
            background: linear-gradient(135deg, #e4b1ef 0%, #860bf9 50%, #4902ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .mobile-loading-text p {
            color: rgba(228, 177, 239, 0.8);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .mobile-progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(228, 177, 239, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin: 20px 0;
        }

        .mobile-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #860bf9, #e4b1ef);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(228, 177, 239, 0.5);
            font-size: 16px;
        }

        /* Swipe Hint */
        .swipe-hint {
            position: absolute;
            bottom: 100px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(228, 177, 239, 0.6);
            font-size: 13px;
            padding: 0 20px;
            z-index: 101;
            pointer-events: none;
            opacity: 0.8;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Responsive Adjustments */
        @media (min-width: 768px) {
            .app-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 24px;
            }
            
            .mobile-app {
                border-radius: 24px;
            }
            
            #recent-apps-list {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Hide browser UI for fullscreen */
        @media all and (display-mode: fullscreen) {
            #status-bar {
                top: 0;
            }
            
            .mobile-window-header {
                padding-top: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Mobile Loading Screen -->
    <div id="mobile-loading">
        <div class="mobile-loading-content">
            <div class="mobile-loading-logo">
                <i class="bi bi-phone"></i>
            </div>
            <div class="mobile-loading-text">
                <h1>VoltaOS</h1>
                <p>Mobile Edition</p>
            </div>
            <div class="mobile-progress-bar">
                <div class="mobile-progress-fill" id="mobile-progress"></div>
            </div>
            <div id="mobile-loading-tip" style="color: rgba(228, 177, 239, 0.7); font-size: 13px; text-align: center;">
                Loading...
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div id="status-bar">
        <div class="status-time" id="mobile-time">--:--</div>
        <div class="status-icons">
            <i class="bi bi-wifi"></i>
            <span class="battery-level" id="battery-level">
                <i class="bi bi-battery-full"></i> 100%
            </span>
        </div>
    </div>

    <!-- Home Screen with App Grid -->
    <div id="home-screen">
        <div id="app-grid-container" class="app-grid"></div>
        
        <!-- Empty state -->
        <div id="empty-state" class="empty-state" style="display: none;">
            <i class="bi bi-inbox" style="font-size: 48px; margin-bottom: 16px; opacity: 0.5;"></i>
            <div>No applications installed</div>
        </div>
    </div>

    <!-- Swipe Hint -->
    <div class="swipe-hint">
        Swipe up from bottom to go home
    </div>

    <!-- Mobile Dock -->
    <div id="mobile-dock">
        <div class="dock-app" id="dock-home" data-action="home">
            <i class="bi bi-house-door dock-icon"></i>
            <div class="dock-label">Home</div>
        </div>
        <div class="dock-app" id="dock-back" data-action="back">
            <i class="bi bi-arrow-left dock-icon"></i>
            <div class="dock-label">Back</div>
        </div>
        <div class="dock-app" id="dock-recent" data-action="recent">
            <i class="bi bi-clock-history dock-icon"></i>
            <div class="dock-label">Recent</div>
        </div>
    </div>

    <!-- Recent Apps Modal -->
    <div id="recent-apps-modal">
        <div class="recent-header">
            <div class="recent-title">Recent Apps</div>
            <div class="recent-close" id="recent-close">×</div>
        </div>
        <div id="recent-apps-list">
            <!-- Recent apps will be populated here -->
        </div>
    </div>

    <!-- Mobile App Windows will be created dynamically -->
    
    <!-- Mobile Notification -->
    <div class="mobile-notification" id="mobile-notification">
        <div class="notification-title">
            <i class="bi bi-info-circle"></i>
            <span id="notification-title">Notification</span>
        </div>
        <div class="notification-message" id="notification-message">Message</div>
    </div>

    <script>
        // Mobile Environment Manager
        class MobileEnvironment {
            constructor() {
                this.apps = [];
                this.windows = [];
                this.activeWindow = null;
                this.currentView = 'home';
                this.isLoading = true;
                this.notificationTimeout = null;
                this.recentApps = [];
                this.batteryLevel = 100;
                this.isCharging = false;
                
                // Initialize from localStorage
                this.loadRecentApps();
                
                this.init();
            }

            async init() {
                // Update time immediately
                this.updateTime();
                
                // Update battery
                this.updateBattery();
                
                // Simulate loading progress
                await this.simulateLoading();
                
                // Load only HoradrimAI
                this.loadApps();
                
                // Setup event listeners
                this.setupEventListeners();
                
                // Setup gesture recognition
                this.setupGestures();
                
                // Hide loading screen
                this.hideLoadingScreen();
                
                // Attempt fullscreen
                this.enterFullscreen();
                
                // Start battery updates
                this.startBatteryUpdates();
            }

            simulateLoading() {
                return new Promise((resolve) => {
                    const progressBar = document.getElementById('mobile-progress');
                    const tipElement = document.getElementById('mobile-loading-tip');
                    const tips = [
                        "Optimizing for mobile...",
                        "Loading applications...",
                        "Setting up recent apps...",
                        "Preparing interface...",
                        "Almost ready..."
                    ];
                    
                    let progress = 0;
                    let tipIndex = 0;
                    
                    const interval = setInterval(() => {
                        progress += 20;
                        progressBar.style.width = `${progress}%`;
                        
                        // Update tip every 20%
                        if (progress % 40 === 0 && tipIndex < tips.length) {
                            tipElement.textContent = tips[tipIndex];
                            tipIndex++;
                        }
                        
                        if (progress >= 100) {
                            clearInterval(interval);
                            setTimeout(resolve, 500);
                        }
                    }, 300);
                });
            }

            hideLoadingScreen() {
                const loadingScreen = document.getElementById('mobile-loading');
                loadingScreen.style.opacity = '0';
                loadingScreen.style.transition = 'opacity 0.5s ease';
                
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    this.isLoading = false;
                    
                    // Show welcome notification
                    this.showNotification('Welcome to VoltaOS Mobile', 'Tap HoradrimAI to begin.');
                }, 500);
            }

            updateTime() {
                const update = () => {
                    const now = new Date();
                    const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    document.getElementById('mobile-time').textContent = timeString;
                };
                
                update();
                setInterval(update, 60000); // Update every minute
            }

            updateBattery() {
                const update = () => {
                    // Gradually decrease battery when not charging
                    if (!this.isCharging) {
                        this.batteryLevel = Math.max(5, this.batteryLevel - 0.1);
                    } else {
                        this.batteryLevel = Math.min(100, this.batteryLevel + 0.5);
                    }
                    
                    // Randomly switch charging state (5% chance)
                    if (Math.random() < 0.05) {
                        this.isCharging = !this.isCharging;
                    }
                    
                    // Update display
                    const batteryElement = document.getElementById('battery-level');
                    let batteryIcon = 'bi-battery';
                    
                    if (this.isCharging) {
                        batteryIcon = 'bi-battery-charging';
                    } else if (this.batteryLevel >= 90) {
                        batteryIcon = 'bi-battery-full';
                    } else if (this.batteryLevel >= 70) {
                        batteryIcon = 'bi-battery';
                    } else if (this.batteryLevel >= 50) {
                        batteryIcon = 'bi-battery-half';
                    } else if (this.batteryLevel >= 20) {
                        batteryIcon = 'bi-battery-low';
                    } else {
                        batteryIcon = 'bi-battery';
                    }
                    
                    batteryElement.innerHTML = `<i class="bi ${batteryIcon}"></i> ${Math.round(this.batteryLevel)}%`;
                };
                
                update();
                setInterval(update, 60000); // Update every minute
            }

            startBatteryUpdates() {
                // Update system status indicators periodically
                setInterval(() => {
                    // Random charging connection (10% chance)
                    if (Math.random() < 0.1) {
                        this.isCharging = !this.isCharging;
                    }
                }, 30000);
            }

            loadApps() {
                // Only HoradrimAI app
                const mobileApps = [
                    {
                        id: 'horadrimai',
                        name: 'HoradrimAI',
                        icon: 'https://horadrimai.vercel.app/chat/assets/icon.png',
                        url: 'https://horadrimai.vercel.app/chat/',
                        category: 'productivity'
                    }
                ];

                this.apps = mobileApps;
                this.renderHomeScreen();
            }

            renderHomeScreen() {
                const container = document.getElementById('app-grid-container');
                const emptyState = document.getElementById('empty-state');
                
                if (this.apps.length === 0) {
                    container.style.display = 'none';
                    emptyState.style.display = 'block';
                    return;
                }

                container.innerHTML = '';
                emptyState.style.display = 'none';

                // Show all apps on home screen (only HoradrimAI)
                this.apps.forEach((app, index) => {
                    const appElement = document.createElement('div');
                    appElement.className = 'mobile-app';
                    appElement.dataset.appId = app.id;
                    appElement.style.animation = `slideUp 0.3s ease forwards`;
                    appElement.style.animationDelay = `${index * 0.1}s`;
                    appElement.style.opacity = '0';
                    
                    appElement.innerHTML = `
                        <div class="mobile-app-icon" style="background-image: url('${app.icon}')"></div>
                        <div class="mobile-app-label">${app.name}</div>
                    `;
                    
                    appElement.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        this.openApp(app);
                    });
                    
                    container.appendChild(appElement);
                });
            }

            loadRecentApps() {
                try {
                    const saved = localStorage.getItem('voltaos_recent_apps');
                    if (saved) {
                        this.recentApps = JSON.parse(saved);
                        // Filter out any invalid entries
                        this.recentApps = this.recentApps.filter(app => app && app.id);
                    }
                } catch (e) {
                    console.error('Failed to load recent apps:', e);
                    this.recentApps = [];
                }
            }

            saveRecentApps() {
                try {
                    // Keep only last 10 recent apps
                    const recentToSave = this.recentApps.slice(0, 10);
                    localStorage.setItem('voltaos_recent_apps', JSON.stringify(recentToSave));
                } catch (e) {
                    console.error('Failed to save recent apps:', e);
                }
            }

            addToRecentApps(app) {
                // Remove if already exists
                this.recentApps = this.recentApps.filter(item => item.id !== app.id);
                
                // Add to beginning with current timestamp
                this.recentApps.unshift({
                    id: app.id,
                    name: app.name,
                    icon: app.icon,
                    url: app.url,
                    timestamp: Date.now(),
                    timeString: this.getTimeString()
                });
                
                // Save to localStorage
                this.saveRecentApps();
                
                // Update recent apps display if modal is open
                if (document.getElementById('recent-apps-modal').classList.contains('active')) {
                    this.renderRecentApps();
                }
            }

            getTimeString() {
                const now = new Date();
                const diff = Date.now() - now.getTime();
                
                if (diff < 60000) { // Less than 1 minute
                    return 'Just now';
                } else if (diff < 3600000) { // Less than 1 hour
                    const minutes = Math.floor(diff / 60000);
                    return `${minutes} minute${minutes !== 1 ? 's' : ''} ago`;
                } else if (diff < 86400000) { // Less than 1 day
                    const hours = Math.floor(diff / 3600000);
                    return `${hours} hour${hours !== 1 ? 's' : ''} ago`;
                } else {
                    const days = Math.floor(diff / 86400000);
                    return `${days} day${days !== 1 ? 's' : ''} ago`;
                }
            }

            renderRecentApps() {
                const container = document.getElementById('recent-apps-list');
                container.innerHTML = '';
                
                if (this.recentApps.length === 0) {
                    container.innerHTML = `
                        <div class="no-recent-apps">
                            <i class="bi bi-clock-history"></i>
                            <div>No recent apps</div>
                        </div>
                    `;
                    return;
                }
                
                this.recentApps.forEach(app => {
                    const appElement = document.createElement('div');
                    appElement.className = 'recent-app-item';
                    appElement.dataset.appId = app.id;
                    
                    appElement.innerHTML = `
                        <div class="recent-app-icon" style="background-image: url('${app.icon}')"></div>
                        <div class="recent-app-info">
                            <div class="recent-app-name">${app.name}</div>
                            <div class="recent-app-time">${app.timeString || 'Recently'}</div>
                        </div>
                    `;
                    
                    appElement.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        this.openRecentApp(app);
                        this.hideRecentApps();
                    });
                    
                    container.appendChild(appElement);
                });
            }

            openRecentApp(appData) {
                const app = {
                    id: appData.id,
                    name: appData.name,
                    icon: appData.icon,
                    url: appData.url
                };
                this.openApp(app);
            }

            openApp(app) {
                // Add to recent apps
                this.addToRecentApps(app);
                
                // Close any existing window for this app
                this.closeAppWindow(app.id);
                
                // Create new mobile window
                const window = new MobileWindow(app);
                this.windows.push(window);
                this.activeWindow = window;
                
                // Update dock active state
                this.updateDockActiveState();
                
                // Show window
                window.show();
            }

            closeAppWindow(appId) {
                const existingWindow = this.windows.find(w => w.app.id === appId);
                if (existingWindow) {
                    existingWindow.close();
                    this.windows = this.windows.filter(w => w !== existingWindow);
                }
            }

            goHome() {
                // Close all windows
                this.windows.forEach(window => window.close());
                this.windows = [];
                this.activeWindow = null;
                
                // Hide recent apps modal if open
                this.hideRecentApps();
                
                // Update dock
                this.updateDockActiveState();
            }

            goBack() {
                if (this.activeWindow) {
                    // Try to go back in iframe
                    const iframe = this.activeWindow.iframe;
                    if (iframe && iframe.contentWindow) {
                        try {
                            iframe.contentWindow.history.back();
                        } catch (e) {
                            // If can't go back, close window
                            this.activeWindow.close();
                            this.activeWindow = null;
                            this.updateDockActiveState();
                        }
                    }
                }
            }

            showRecentApps() {
                this.renderRecentApps();
                const modal = document.getElementById('recent-apps-modal');
                modal.style.display = 'flex';
                setTimeout(() => {
                    modal.classList.add('active');
                }, 10);
            }

            hideRecentApps() {
                const modal = document.getElementById('recent-apps-modal');
                modal.classList.remove('active');
                setTimeout(() => {
                    modal.style.display = 'none';
                }, 400);
            }

            updateDockActiveState() {
                // Clear all active states
                document.querySelectorAll('.dock-app').forEach(app => {
                    app.classList.remove('active');
                });
                
                // Set active state based on current view
                if (this.activeWindow) {
                    document.getElementById('dock-back').classList.add('active');
                } else {
                    document.getElementById('dock-home').classList.add('active');
                }
            }

            showNotification(title, message, duration = 3000) {
                const notification = document.getElementById('mobile-notification');
                const titleElement = document.getElementById('notification-title');
                const messageElement = document.getElementById('notification-message');
                
                // Clear any existing timeout
                if (this.notificationTimeout) {
                    clearTimeout(this.notificationTimeout);
                    notification.classList.remove('show');
                }
                
                // Update content
                titleElement.textContent = title;
                messageElement.textContent = message;
                
                // Show notification
                setTimeout(() => {
                    notification.style.display = 'block';
                    setTimeout(() => {
                        notification.classList.add('show');
                    }, 10);
                }, 10);
                
                // Auto-hide after duration
                this.notificationTimeout = setTimeout(() => {
                    notification.classList.remove('show');
                    setTimeout(() => {
                        notification.style.display = 'none';
                    }, 400);
                }, duration);
            }

            enterFullscreen() {
                // Try to enter fullscreen
                const docEl = document.documentElement;
                
                // Request fullscreen on user interaction
                const requestFullscreen = () => {
                    if (docEl.requestFullscreen) {
                        docEl.requestFullscreen();
                    } else if (docEl.webkitRequestFullscreen) {
                        docEl.webkitRequestFullscreen();
                    } else if (docEl.msRequestFullscreen) {
                        docEl.msRequestFullscreen();
                    }
                };
                
                // Try to enter fullscreen after a short delay
                setTimeout(requestFullscreen, 1000);
                
                // Also try on first touch
                document.addEventListener('touchstart', requestFullscreen, { once: true });
            }

            setupEventListeners() {
                // Dock actions
                document.querySelectorAll('.dock-app').forEach(app => {
                    app.addEventListener('click', (e) => {
                        const action = e.currentTarget.dataset.action;
                        
                        switch(action) {
                            case 'home':
                                this.goHome();
                                break;
                            case 'back':
                                this.goBack();
                                break;
                            case 'recent':
                                this.showRecentApps();
                                break;
                        }
                    });
                });

                // Recent apps close button
                document.getElementById('recent-close').addEventListener('click', () => {
                    this.hideRecentApps();
                });

                // Prevent context menu on long press
                document.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                });

                // Handle back button on Android
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' || e.key === 'Escape') {
                        this.goBack();
                        e.preventDefault();
                    }
                });

                // Handle orientation changes
                window.addEventListener('orientationchange', () => {
                    setTimeout(() => {
                        this.showNotification('Orientation Changed', 'Screen orientation updated.', 1500);
                    }, 300);
                });
            }

            setupGestures() {
                let startY = 0;
                let startX = 0;
                let isScrolling;

                document.addEventListener('touchstart', (e) => {
                    startY = e.touches[0].pageY;
                    startX = e.touches[0].pageX;
                    isScrolling = undefined;
                }, false);

                document.addEventListener('touchmove', (e) => {
                    if (!startY || !startX) return;
                    
                    const y = e.touches[0].pageY;
                    const x = e.touches[0].pageX;
                    const dy = startY - y;
                    const dx = startX - x;
                    
                    // Determine if user is trying to scroll horizontally or vertically
                    if (isScrolling === undefined) {
                        isScrolling = Math.abs(dx) < Math.abs(dy);
                    }
                    
                    // Vertical swipe from bottom to go home (like Android gesture)
                    if (isScrolling && dy < -100 && y > window.innerHeight - 100) {
                        this.goHome();
                        startY = null;
                        startX = null;
                    }
                }, false);

                document.addEventListener('touchend', () => {
                    startY = null;
                    startX = null;
                }, false);
            }
        }

        // Mobile Window Class
        class MobileWindow {
            constructor(app) {
                this.app = app;
                this.id = `window-${app.id}-${Date.now()}`;
                this.element = null;
                this.iframe = null;
                this.isOpen = false;
                
                this.createWindow();
            }

            createWindow() {
                this.element = document.createElement('div');
                this.element.className = 'mobile-window';
                this.element.id = this.id;
                
                this.element.innerHTML = `
                    <div class="mobile-window-header">
                        <div class="mobile-window-title">
                            <div class="mobile-window-icon" style="background-image: url('${this.app.icon}')"></div>
                            <div class="mobile-window-label">${this.app.name}</div>
                        </div>
                        <div class="mobile-window-close" id="${this.id}-close">×</div>
                    </div>
                    <div class="mobile-window-content">
                        <iframe class="mobile-iframe" src="${this.app.url}" id="${this.id}-iframe" allowfullscreen></iframe>
                    </div>
                `;
                
                document.body.appendChild(this.element);
                
                // Get iframe reference
                this.iframe = document.getElementById(`${this.id}-iframe`);
                
                // Add close button event
                document.getElementById(`${this.id}-close`).addEventListener('click', () => {
                    this.close();
                    if (window.mobileEnv) {
                        window.mobileEnv.activeWindow = null;
                        window.mobileEnv.updateDockActiveState();
                    }
                });
            }

            show() {
                this.element.style.display = 'flex';
                setTimeout(() => {
                    this.element.classList.add('active');
                }, 10);
                this.isOpen = true;
            }

            close() {
                this.element.classList.remove('active');
                this.isOpen = false;
                
                // Remove from DOM after animation
                setTimeout(() => {
                    if (this.element && this.element.parentNode) {
                        this.element.remove();
                    }
                }, 400);
            }
        }

        // Initialize mobile environment when page loads
        document.addEventListener('DOMContentLoaded', () => {
            // Check if mobile device
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            if (!isMobile) {
                // Redirect to desktop version if on desktop
                window.location.href = '/';
                return;
            }
            
            // Start mobile environment
            window.mobileEnv = new MobileEnvironment();
        });

        // Prevent zoom on double tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (event) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        // Handle fullscreen changes
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                // Try to re-enter fullscreen
                setTimeout(() => {
                    const docEl = document.documentElement;
                    if (docEl.requestFullscreen) {
                        docEl.requestFullscreen();
                    }
                }, 1000);
            }
        });

        // Prevent pull-to-refresh
        document.body.style.overscrollBehavior = 'none';
    </script>
</body>
