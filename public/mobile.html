<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoltaOS Mobile</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background-color: #301934;
            background-image: url("assets/img/wallpaper.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* Mobile Status Bar */
        #status-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 28px;
            background: rgba(48, 25, 52, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 3000;
            border-bottom: 1px solid rgba(187, 79, 246, 0.2);
        }

        .status-time {
            color: rgba(228, 177, 239, 0.95);
            font-size: 14px;
            font-weight: 600;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(228, 177, 239, 0.95);
            font-size: 14px;
        }

        /* Mobile Dock */
        #mobile-dock {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(48, 25, 52, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(187, 79, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 10px;
            z-index: 2000;
        }

        .dock-app {
            width: 56px;
            height: 56px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            transition: all 0.2s ease;
            position: relative;
        }

        .dock-app.active {
            background: rgba(134, 11, 249, 0.25);
            transform: translateY(-5px);
        }

        .dock-icon {
            width: 32px;
            height: 32px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin-bottom: 4px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .dock-label {
            color: rgba(228, 177, 239, 0.9);
            font-size: 10px;
            text-align: center;
            font-weight: 500;
        }

        /* Home Screen */
        #home-screen {
            position: fixed;
            top: 28px;
            left: 0;
            width: 100%;
            height: calc(100vh - 98px);
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 1;
            padding: 16px;
            -webkit-overflow-scrolling: touch;
        }

        /* Mobile App Grid */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 16px;
        }

        .mobile-app {
            width: 100%;
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: rgba(72, 13, 141, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(187, 79, 246, 0.2);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .mobile-app:active {
            background: rgba(96, 21, 189, 0.6);
            transform: scale(0.95);
        }

        .mobile-app-icon {
            width: 48px;
            height: 48px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
        }

        .mobile-app-label {
            color: rgba(228, 177, 239, 0.95);
            font-size: 12px;
            font-weight: 600;
            text-align: center;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            padding: 0 4px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Mobile App Window (Full Screen) */
        .mobile-window {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(52, 17, 75, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 4000;
            display: none;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mobile-window.active {
            display: flex;
            transform: translateX(0);
        }

        .mobile-window-header {
            height: 60px;
            background: rgba(48, 25, 52, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(187, 79, 246, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: relative;
            flex-shrink: 0;
        }

        .mobile-window-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mobile-window-icon {
            width: 24px;
            height: 24px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.4));
        }

        .mobile-window-label {
            color: rgba(228, 177, 239, 0.95);
            font-size: 16px;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        }

        .mobile-window-close {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(72, 13, 141, 0.4);
            border: 1px solid rgba(187, 79, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(228, 177, 239, 0.9);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mobile-window-close:active {
            background: rgba(96, 21, 189, 0.6);
            transform: scale(0.9);
        }

        .mobile-window-content {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .mobile-iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        /* Mobile Swipe Gestures */
        .gesture-area {
            position: fixed;
            top: 28px;
            left: 0;
            width: 100%;
            height: calc(100vh - 98px);
            z-index: 100;
            pointer-events: none;
        }

        /* Mobile Notifications */
        .mobile-notification {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(-100%);
            width: 90%;
            max-width: 400px;
            background: rgba(52, 17, 75, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(187, 79, 246, 0.3);
            border-radius: 12px;
            padding: 16px;
            z-index: 5000;
            transition: transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .mobile-notification.show {
            transform: translateX(-50%) translateY(0);
        }

        .notification-title {
            color: rgba(228, 177, 239, 0.95);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .notification-message {
            color: rgba(228, 177, 239, 0.8);
            font-size: 14px;
            line-height: 1.4;
        }

        /* Mobile Loading Screen */
        #mobile-loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(48, 25, 52, 0.98);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }

        .mobile-loading-content {
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .mobile-loading-logo {
            margin-bottom: 30px;
        }

        .mobile-loading-logo svg {
            filter: drop-shadow(0 0 10px rgba(134, 11, 249, 0.4));
        }

        .mobile-loading-text h1 {
            font-size: 32px;
            font-weight: 300;
            background: linear-gradient(135deg, #e4b1ef 0%, #860bf9 50%, #4902ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .mobile-loading-text p {
            color: rgba(228, 177, 239, 0.8);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .mobile-progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(228, 177, 239, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin: 20px 0;
        }

        .mobile-progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #860bf9, #e4b1ef);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        /* Mobile App Drawer */
        #app-drawer {
            position: fixed;
            top: 28px;
            left: 0;
            width: 100%;
            height: calc(100vh - 98px);
            background: rgba(52, 17, 75, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 3001;
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .app-drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(187, 79, 246, 0.2);
        }

        .app-drawer-title {
            color: rgba(228, 177, 239, 0.95);
            font-size: 20px;
            font-weight: 600;
        }

        .app-drawer-close {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: rgba(72, 13, 141, 0.4);
            border: 1px solid rgba(187, 79, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(228, 177, 239, 0.9);
            font-size: 20px;
            cursor: pointer;
        }

        .app-drawer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        /* Swipe Indicators */
        .swipe-hint {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(228, 177, 239, 0.6);
            font-size: 12px;
            padding: 0 20px;
            z-index: 101;
            pointer-events: none;
        }

        /* Responsive Adjustments */
        @media (max-width: 320px) {
            .app-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }
            
            .app-drawer-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 768px) and (max-width: 1024px) {
            .app-grid {
                grid-template-columns: repeat(5, 1fr);
            }
            
            .app-drawer-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Custom Scrollbar for Mobile */
        #home-screen::-webkit-scrollbar {
            width: 6px;
        }

        #home-screen::-webkit-scrollbar-track {
            background: transparent;
        }

        #home-screen::-webkit-scrollbar-thumb {
            background: rgba(134, 11, 249, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <!-- Mobile Loading Screen -->
    <div id="mobile-loading">
        <div class="mobile-loading-content">
            <div class="mobile-loading-logo">
                <svg width="80" height="80" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(134, 11, 249, 0.9)" stroke-width="3" stroke-linecap="round">
                        <animate attributeName="stroke-dasharray" values="0 300; 282 300; 0 300" dur="2.5s" repeatCount="indefinite" />
                    </circle>
                </svg>
            </div>
            <div class="mobile-loading-text">
                <h1>VoltaOS</h1>
                <p>Mobile Edition</p>
            </div>
            <div class="mobile-progress-bar">
                <div class="mobile-progress-fill" id="mobile-progress"></div>
            </div>
            <div id="mobile-loading-tip" style="color: rgba(228, 177, 239, 0.7); font-size: 13px; text-align: center;">
                Loading...
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div id="status-bar">
        <div class="status-time" id="mobile-time">--:--</div>
        <div class="status-icons">
            <span id="mobile-battery">100%</span>
            <span id="mobile-wifi">WiFi</span>
        </div>
    </div>

    <!-- Home Screen with App Grid -->
    <div id="home-screen">
        <!-- App grid will be populated by JavaScript -->
        <div id="app-grid-container" class="app-grid"></div>
        
        <!-- Empty state -->
        <div id="empty-state" style="display: none; text-align: center; padding: 40px 20px; color: rgba(228, 177, 239, 0.5);">
            No applications installed
        </div>
    </div>

    <!-- Swipe Gesture Area -->
    <div class="gesture-area"></div>
    
    <!-- Swipe Hint -->
    <div class="swipe-hint">
        Swipe up for app drawer
    </div>

    <!-- Mobile Dock -->
    <div id="mobile-dock">
        <div class="dock-app" id="dock-home" data-action="home">
            <div class="dock-icon" style="background-image: url('assets/img/home.svg')"></div>
            <div class="dock-label">Home</div>
        </div>
        <div class="dock-app" id="dock-apps" data-action="app-drawer">
            <div class="dock-icon" style="background-image: url('assets/img/apps.svg')"></div>
            <div class="dock-label">Apps</div>
        </div>
        <div class="dock-app" id="dock-back" data-action="back">
            <div class="dock-icon" style="background-image: url('assets/img/back.svg')"></div>
            <div class="dock-label">Back</div>
        </div>
        <div class="dock-app" id="dock-recent" data-action="recent">
            <div class="dock-icon" style="background-image: url('assets/img/recent.svg')"></div>
            <div class="dock-label">Recent</div>
        </div>
    </div>

    <!-- App Drawer -->
    <div id="app-drawer">
        <div class="app-drawer-header">
            <div class="app-drawer-title">All Applications</div>
            <div class="app-drawer-close" id="drawer-close">×</div>
        </div>
        <div id="app-drawer-grid" class="app-drawer-grid"></div>
    </div>

    <!-- Mobile App Windows will be created dynamically -->
    
    <!-- Mobile Notification -->
    <div class="mobile-notification" id="mobile-notification">
        <div class="notification-title" id="notification-title">Notification</div>
        <div class="notification-message" id="notification-message">Message</div>
    </div>

    <script>
        // Mobile Environment Manager
        class MobileEnvironment {
            constructor() {
                this.apps = [];
                this.windows = [];
                this.activeWindow = null;
                this.currentView = 'home';
                this.isLoading = true;
                this.touchStartY = 0;
                this.touchStartX = 0;
                
                this.init();
            }

            async init() {
                // Update time immediately
                this.updateTime();
                
                // Simulate loading progress
                await this.simulateLoading();
                
                // Load default apps
                this.loadDefaultApps();
                
                // Setup event listeners
                this.setupEventListeners();
                
                // Setup gesture recognition
                this.setupGestures();
                
                // Hide loading screen
                this.hideLoadingScreen();
            }

            simulateLoading() {
                return new Promise((resolve) => {
                    const progressBar = document.getElementById('mobile-progress');
                    const tipElement = document.getElementById('mobile-loading-tip');
                    const tips = [
                        "Optimizing for mobile...",
                        "Loading applications...",
                        "Setting up touch gestures...",
                        "Preparing interface...",
                        "Almost ready..."
                    ];
                    
                    let progress = 0;
                    let tipIndex = 0;
                    
                    const interval = setInterval(() => {
                        progress += 20;
                        progressBar.style.width = `${progress}%`;
                        
                        // Update tip every 20%
                        if (progress % 40 === 0 && tipIndex < tips.length) {
                            tipElement.textContent = tips[tipIndex];
                            tipIndex++;
                        }
                        
                        if (progress >= 100) {
                            clearInterval(interval);
                            setTimeout(resolve, 500);
                        }
                    }, 300);
                });
            }

            hideLoadingScreen() {
                const loadingScreen = document.getElementById('mobile-loading');
                loadingScreen.style.opacity = '0';
                loadingScreen.style.transition = 'opacity 0.5s ease';
                
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    this.isLoading = false;
                    
                    // Show welcome notification
                    this.showNotification('Welcome to VoltaOS Mobile', 'Swipe up to access all applications.');
                }, 500);
            }

            updateTime() {
                const update = () => {
                    const now = new Date();
                    const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    document.getElementById('mobile-time').textContent = timeString;
                    
                    // Update battery simulation
                    this.updateBattery();
                };
                
                update();
                setInterval(update, 60000); // Update every minute
            }

            updateBattery() {
                // Simulate battery percentage (in real app, this would use battery API)
                const batteryElement = document.getElementById('mobile-battery');
                const battery = Math.floor(Math.random() * 20) + 80; // Random between 80-100%
                batteryElement.textContent = `${battery}%`;
            }

            loadDefaultApps() {
                // Default apps for mobile environment
                const defaultApps = [
                    {
                        id: 'horadrimai',
                        name: 'HoradrimAI',
                        icon: 'https://horadrimai.vercel.app/chat/assets/icon.png',
                        url: 'https://horadrimai.vercel.app/chat/',
                        category: 'productivity'
                    },
                    {
                        id: 'settings',
                        name: 'Settings',
                        icon: 'assets/img/settings.svg',
                        url: '#',
                        category: 'system'
                    },
                    {
                        id: 'browser',
                        name: 'Browser',
                        icon: 'assets/img/browser.svg',
                        url: 'https://google.com',
                        category: 'internet'
                    },
                    {
                        id: 'calendar',
                        name: 'Calendar',
                        icon: 'assets/img/calendar.svg',
                        url: '#',
                        category: 'productivity'
                    },
                    {
                        id: 'camera',
                        name: 'Camera',
                        icon: 'assets/img/camera.svg',
                        url: '#',
                        category: 'media'
                    },
                    {
                        id: 'photos',
                        name: 'Photos',
                        icon: 'assets/img/photos.svg',
                        url: '#',
                        category: 'media'
                    },
                    {
                        id: 'music',
                        name: 'Music',
                        icon: 'assets/img/music.svg',
                        url: '#',
                        category: 'media'
                    },
                    {
                        id: 'messages',
                        name: 'Messages',
                        icon: 'assets/img/messages.svg',
                        url: '#',
                        category: 'communication'
                    }
                ];

                this.apps = defaultApps;
                this.renderHomeScreen();
                this.renderAppDrawer();
            }

            renderHomeScreen() {
                const container = document.getElementById('app-grid-container');
                const emptyState = document.getElementById('empty-state');
                
                if (this.apps.length === 0) {
                    container.style.display = 'none';
                    emptyState.style.display = 'block';
                    return;
                }

                container.innerHTML = '';
                emptyState.style.display = 'none';

                // Show first 8 apps on home screen
                const homeApps = this.apps.slice(0, 8);
                
                homeApps.forEach(app => {
                    const appElement = document.createElement('div');
                    appElement.className = 'mobile-app';
                    appElement.dataset.appId = app.id;
                    appElement.style.animation = 'slideUp 0.3s ease forwards';
                    appElement.style.animationDelay = `${Math.random() * 0.2}s`;
                    appElement.style.opacity = '0';
                    
                    appElement.innerHTML = `
                        <div class="mobile-app-icon" style="background-image: url('${app.icon}')"></div>
                        <div class="mobile-app-label">${app.name}</div>
                    `;
                    
                    appElement.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        this.openApp(app);
                    });
                    
                    container.appendChild(appElement);
                });
            }

            renderAppDrawer() {
                const container = document.getElementById('app-drawer-grid');
                container.innerHTML = '';
                
                this.apps.forEach(app => {
                    const appElement = document.createElement('div');
                    appElement.className = 'mobile-app';
                    appElement.dataset.appId = app.id;
                    
                    appElement.innerHTML = `
                        <div class="mobile-app-icon" style="background-image: url('${app.icon}')"></div>
                        <div class="mobile-app-label">${app.name}</div>
                    `;
                    
                    appElement.addEventListener('click', (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        this.openApp(app);
                        this.hideAppDrawer();
                    });
                    
                    container.appendChild(appElement);
                });
            }

            openApp(app) {
                // Close any existing window for this app
                this.closeAppWindow(app.id);
                
                // Create new mobile window
                const window = new MobileWindow(app);
                this.windows.push(window);
                this.activeWindow = window;
                
                // Update dock active state
                this.updateDockActiveState();
                
                // Show window
                window.show();
                
                // Log recent app
                this.addToRecent(app);
            }

            closeAppWindow(appId) {
                const existingWindow = this.windows.find(w => w.app.id === appId);
                if (existingWindow) {
                    existingWindow.close();
                    this.windows = this.windows.filter(w => w !== existingWindow);
                }
            }

            addToRecent(app) {
                // In a real app, this would save to localStorage
                console.log(`Added ${app.name} to recent apps`);
            }

            showAppDrawer() {
                document.getElementById('app-drawer').style.display = 'flex';
                this.currentView = 'drawer';
                setTimeout(() => {
                    document.getElementById('app-drawer').style.opacity = '1';
                }, 10);
            }

            hideAppDrawer() {
                const drawer = document.getElementById('app-drawer');
                drawer.style.opacity = '0';
                setTimeout(() => {
                    drawer.style.display = 'none';
                    this.currentView = 'home';
                }, 300);
            }

            goHome() {
                // Close all windows
                this.windows.forEach(window => window.close());
                this.windows = [];
                this.activeWindow = null;
                
                // Hide drawer if open
                this.hideAppDrawer();
                
                // Update dock
                this.updateDockActiveState();
            }

            goBack() {
                if (this.activeWindow) {
                    // Try to go back in iframe
                    const iframe = this.activeWindow.iframe;
                    if (iframe && iframe.contentWindow) {
                        try {
                            iframe.contentWindow.history.back();
                        } catch (e) {
                            // If can't go back, close window
                            this.activeWindow.close();
                            this.activeWindow = null;
                        }
                    }
                } else if (this.currentView === 'drawer') {
                    this.hideAppDrawer();
                }
            }

            showRecentApps() {
                this.showNotification('Recent Apps', 'Feature coming soon...');
            }

            updateDockActiveState() {
                // Clear all active states
                document.querySelectorAll('.dock-app').forEach(app => {
                    app.classList.remove('active');
                });
                
                // Set active state based on current view
                if (this.activeWindow) {
                    document.getElementById('dock-back').classList.add('active');
                } else if (this.currentView === 'drawer') {
                    document.getElementById('dock-apps').classList.add('active');
                } else {
                    document.getElementById('dock-home').classList.add('active');
                }
            }

            showNotification(title, message, duration = 3000) {
                const notification = document.getElementById('mobile-notification');
                document.getElementById('notification-title').textContent = title;
                document.getElementById('notification-message').textContent = message;
                
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, duration);
            }

            setupEventListeners() {
                // Dock actions
                document.querySelectorAll('.dock-app').forEach(app => {
                    app.addEventListener('click', (e) => {
                        const action = e.currentTarget.dataset.action;
                        
                        switch(action) {
                            case 'home':
                                this.goHome();
                                break;
                            case 'app-drawer':
                                this.showAppDrawer();
                                break;
                            case 'back':
                                this.goBack();
                                break;
                            case 'recent':
                                this.showRecentApps();
                                break;
                        }
                    });
                });

                // App drawer close
                document.getElementById('drawer-close').addEventListener('click', () => {
                    this.hideAppDrawer();
                });

                // Handle back button (Android/iOS)
                window.addEventListener('popstate', () => {
                    this.goBack();
                });

                // Prevent context menu on long press
                document.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                });
            }

            setupGestures() {
                const gestureArea = document.querySelector('.gesture-area');
                let touchStartY = 0;
                let touchStartX = 0;
                let isSwiping = false;

                gestureArea.addEventListener('touchstart', (e) => {
                    touchStartY = e.touches[0].clientY;
                    touchStartX = e.touches[0].clientX;
                    isSwiping = false;
                });

                gestureArea.addEventListener('touchmove', (e) => {
                    if (!touchStartY || !touchStartX) return;
                    
                    const touchY = e.touches[0].clientY;
                    const touchX = e.touches[0].clientX;
                    const deltaY = touchStartY - touchY;
                    const deltaX = touchStartX - touchX;
                    
                    // Vertical swipe detection
                    if (Math.abs(deltaY) > Math.abs(deltaX) && Math.abs(deltaY) > 30) {
                        isSwiping = true;
                        
                        // Swipe up to show app drawer
                        if (deltaY > 0 && this.currentView === 'home' && !this.activeWindow) {
                            this.showAppDrawer();
                            touchStartY = 0;
                        }
                    }
                });

                gestureArea.addEventListener('touchend', () => {
                    touchStartY = 0;
                    touchStartX = 0;
                });
            }
        }

        // Mobile Window Class
        class MobileWindow {
            constructor(app) {
                this.app = app;
                this.id = `window-${app.id}-${Date.now()}`;
                this.element = null;
                this.iframe = null;
                this.isOpen = false;
                
                this.createWindow();
            }

            createWindow() {
                this.element = document.createElement('div');
                this.element.className = 'mobile-window';
                this.element.id = this.id;
                
                this.element.innerHTML = `
                    <div class="mobile-window-header">
                        <div class="mobile-window-title">
                            <div class="mobile-window-icon" style="background-image: url('${this.app.icon}')"></div>
                            <div class="mobile-window-label">${this.app.name}</div>
                        </div>
                        <div class="mobile-window-close" id="${this.id}-close">×</div>
                    </div>
                    <div class="mobile-window-content">
                        <iframe class="mobile-iframe" src="${this.app.url}" id="${this.id}-iframe"></iframe>
                    </div>
                `;
                
                document.body.appendChild(this.element);
                
                // Get iframe reference
                this.iframe = document.getElementById(`${this.id}-iframe`);
                
                // Add close button event
                document.getElementById(`${this.id}-close`).addEventListener('click', () => {
                    this.close();
                });
            }

            show() {
                this.element.classList.add('active');
                this.isOpen = true;
                
                // Add to history
                window.history.pushState({ windowId: this.id }, '', `#${this.app.id}`);
            }

            close() {
                this.element.classList.remove('active');
                this.isOpen = false;
                
                // Remove from DOM after animation
                setTimeout(() => {
                    if (this.element && this.element.parentNode) {
                        this.element.remove();
                    }
                }, 300);
            }
        }

        // Initialize mobile environment when page loads
        document.addEventListener('DOMContentLoaded', () => {
            // Check if mobile device
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            if (!isMobile && !confirm("This is the mobile interface. Switch to desktop version?")) {
                // Redirect to desktop version if on desktop
                window.location.href = 'index.html';
                return;
            }
            
            // Start mobile environment
            window.mobileEnv = new MobileEnvironment();
        });

        // Prevent zoom on double tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (event) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
